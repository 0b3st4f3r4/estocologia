name: Verificacao Obrigatoria (AGENTS.md §V)

# A lista de comandos nao mora aqui: mora em scripts/verificar.sh, e este workflow so a chama.
# Enquanto a lista existiu nos dois lugares, o contrato cobrava 29 comandos e o CI rodava 11.

on:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacao:
    # Imagem fixada: `ubuntu-latest` migra para o Ubuntu 26 em 2026-10-19 e trocaria o ambiente
    # debaixo do portao sem ninguem pedir. Trocar de imagem e decisao, nao efeito colateral.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # A passada de prosa compara com o commit de base; sem historico nao ha base.
          fetch-depth: 0

      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Base da passada de prosa (pull request contra main)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verificacao obrigatoria de AGENTS.md §V
        env:
          ESTOCOLOGIA_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD' }}
        run: scripts/verificar.sh

      - name: Guardar o relatorio dos instrumentos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verificacao
          path: |
            RESULTADOS_RUST.md
            estocologia-livro-didatico.md
          if-no-files-found: warn
