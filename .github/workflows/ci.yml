name: Mandatory Verification (AGENTS.md §V)

on:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Toolchain pinned in rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Base for prose pass (pull request against main)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Mandatory verification of AGENTS.md §V
        env:
          ESTOCOLOGIA_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD' }}
        run: scripts/verify.sh

      - name: Upload instrument report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            docs/RUST_RESULTS.md
            book/stochology-textbook.md
          if-no-files-found: warn
