decision_maker_question:
  who_decides: "Call Center Operations Superintendent"
  altered_action: "Allocate 26 agents to the daily peak shift instead of the aggregate average of 20"
  question: "Does the probability of waiting-time exceedance above 30 minutes on the operational day exceed the cost-loss threshold p* = 0.08000?"

