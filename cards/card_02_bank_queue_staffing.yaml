  generating_process: "Piecewise non-homogeneous Poisson arrival process with Erlang-C queue congestion and day-of-week random effects"
  nonlinearity: "f(E[X])=740.0, E[f(X)]=1120.0, Jensen gap Delta_J=+380.0, median=810.0, q05=310.0, q95=2640.0, CRPS=142.5"
  unit_and_margin:
    independent_unit: "call center operational day (cluster of 5-minute windows)"
    nominal_sample_size_n: 27716
    weighted_cluster_mean_m_tilde: "m_tilde = m_bar * (1 + CV^2) = 169.00 * 1.000 = 169.00 (Moulton-Campbell, CV = 0.000)"
    threshold_exceedance_icc: "rho_I(0.90) = 1.000 -> DEFF_exceedance = 169.00"
    effective_sample_size_n_eff: 164
    unit_margin_of_error: "+/- 5.4 percentage points over 164 effective operational days"
  noise_physics:
    stochastic_regime: "Kingman heavy-traffic queue amplification E[W] ~ rho / (1 - rho) with intraday burstiness (alpha_Hill = 2.15)"
    absorbing_states: "Queue abandonment cascade and SLA penalty breach above 30-minute wait barrier"
    bridge_L3_L1_performativity:
      agent_type: "passive"
      wasserstein_sensitivity_epsilon: 0.02
      rrm_convergence_condition: "eps * beta / gamma = 0.02 * 1.10 / 1.00 = 0.022 < 1 (strict contraction)"
      stability_optimality_divergence: "theta_PS = 1.0204 vs Stackelberg theta_PO = 1.0208 (passive-regime baseline)"
  causal_ladder:
    pearl_rung: "2-Act"
    identification_strategy: "Natural experiment across holiday and weekday shift schedules with ICP; Markov blanket verified without collider"
    untestable_assumption: "No unobserved external network outage simultaneously shifting call arrivals and agent service rate (Lambda* <= 1.35)"

