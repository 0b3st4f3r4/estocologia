nome: logistica_voos
area: Logística
titulo: Hora programada e atraso de partida nos aeroportos de Nova York (2013)
pergunta: Programar o voo mais cedo reduz a chance de atraso de partida, e a relação vale num aeroporto que o modelo não viu?
alegacao: '"Cada hora mais tarde na grade aumenta o risco de atraso por propagação; mover voos para a manhã reduz atrasos em qualquer aeroporto."'
glossario:
  atraso_de_partida: partida mais de 15 min depois do horário programado (definição do DOT)
  propagacao: atraso que um avião carrega de um voo anterior do mesmo dia
  hora_programada: hora cheia da partida prevista na grade
  grade: conjunto de horários de partida de uma companhia
  slot: direito de pouso ou decolagem num intervalo de tempo
  hub: aeroporto concentrador de conexões de uma companhia
  visibilidade: alcance visual em milhas na estação meteorológica do aeroporto
  teto_operacional: condições mínimas de visibilidade e nuvens para operar por instrumentos
  ground_delay_program: retenção em solo determinada pelo controle de tráfego aéreo
  cancelamento: voo que não decolou; fica fora desta base de atrasos
fontes:
  - Bureau of Transportation Statistics, On-Time Performance (via nycflights13)
  - Wickham (2013), pacote nycflights13
  - data/h2/nycflights13_flights.csv e nycflights13_weather.csv (Rdatasets)
arquivos: [nycflights13_flights.csv, nycflights13_weather.csv]
familia: binomial
desfecho: partida com mais de 15 min de atraso (1) ou não (0)
chave: hora_programada
candidatos:
  hora_programada: {tipo: num, descricao: hora programada de partida (5 a 23)}
  chuva: {tipo: num, descricao: precipitação positiva na hora}
  visibilidade: {tipo: num, descricao: visibilidade em milhas}
  vento: {tipo: num, descricao: velocidade do vento em mph}
  temperatura: {tipo: num, descricao: temperatura em °F}
  distancia_mil_milhas: {tipo: num, descricao: distância do voo em milhares de milhas}
  companhia: {tipo: cat, descricao: as 8 maiores companhias e "outra"}
icp_candidatos: [hora_programada, chuva, visibilidade, vento, temperatura, distancia_mil_milhas, companhia]
ajuste: [chuva, visibilidade, vento, companhia, distancia_mil_milhas]
dag:
  - [hora_programada, y]
  - [chuva, y]
  - [visibilidade, y]
  - [vento, y]
  - [temperatura, y]
  - [chuva, visibilidade]
  - [hora_programada, temperatura]
  - [companhia, hora_programada]
  - [companhia, y]
  - [distancia_mil_milhas, hora_programada]
  - [distancia_mil_milhas, y]
ambientes:
  descricao: aeroporto de origem; LaGuardia (LGA) fica no cofre, nunca visto
  cofre: [LGA]
unidade: o dia do ano (365); clima, controle de tráfego e propagação são comuns aos voos de um dia
cabecalho:
  processo_gerador: Cada voo tem hora programada; atrasos se acumulam ao longo do dia pela rotação das aeronaves e são disparados por clima e congestionamento.
  nao_linearidade: Risco na escala logística; a propagação faz o atraso crescer com a hora, e um dia ruim contamina todos os voos.
  unidade_e_margem: O dia é a unidade (365 dias contra ~300 mil voos); margem com erro padrão agrupado por dia.
  fisica_do_ruido: Choques de clima e de controle de tráfego comuns ao dia (dependência forte), mais ruído de voo.
  escada_causal: Degrau 1 (observacional). A hora não é sorteada - companhias escolhem a grade (companhia e distância ajustadas); a temperatura é mediadora parcial da hora (descendente) e fica fora do ajuste.
shelf:
  quantidade: razão de chances de atraso por hora mais tarde na grade
  escala: razao_de_chances
  fonte: literatura de operações aéreas sobre propagação de atrasos (citada de memória, por conferir); nenhum especialista humano consultado
  painel: literatura publicada
  taxa_base: 0.22
  quartis: {q05: 1.02, q25: 1.06, q50: 1.08, q75: 1.10, q95: 1.14}
decisao:
  acao: mover voos da tarde para a manhã na grade
  beneficio_por_unidade: 1000.0
  custo: 12.0
  custo_pesquisa: 0.1
  nota: utilidade em unidades de custo por voo; benefício por ponto de probabilidade de atraso evitado por hora; o custo de remarcar (slots, demanda) é suposição a elicitar com a companhia
termo_escopo:
  vale_para: partidas dos três aeroportos de Nova York, padrão de grade e clima de 2013
  nao_vale_para: aeroportos sem congestionamento, grades redesenhadas em massa (o congestionamento muda), cancelamentos
tentativas_de_especificacao: 2
historico_especificacoes:
  - "K=1 (2026-10-14): ajuste incluía a temperatura, descendente da hora no próprio DAG; o Filtro 2 barrou (porta dos fundos inválida). Corrigido antes de qualquer leitura do cofre." 
tem_titulares: false
