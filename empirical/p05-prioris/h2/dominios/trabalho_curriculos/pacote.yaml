nome: trabalho_curriculos
area: Trabalho
titulo: Nomes afro-americanos e retorno de currículos (Boston e Chicago, 2001–2002)
pergunta: Um nome de sonoridade afro-americana no currículo reduz a chance de retorno do empregador, e a diferença vale numa cidade que o modelo não viu?
alegacao: '"Currículos idênticos com nomes como Lakisha e Jamal recebem cerca de um terço menos retornos que os com nomes como Emily e Greg, em qualquer mercado de trabalho."'
glossario:
  estudo_de_correspondencia: envio de candidaturas fictícias pareadas a vagas reais para medir discriminação na triagem
  retorno: ligação ou e-mail do empregador convidando para entrevista ou pedindo contato
  nome_sinalizador: prenome escolhido por ser típico de um grupo racial nas certidões de nascimento
  banco_de_curriculos: currículos reais adaptados, separados em qualidade alta e baixa pelos pesquisadores
  qualidade_alta: currículo com mais experiência, menos lacunas, honras, e-mail, habilidades e certificações
  lacuna: período sem emprego no histórico profissional
  anuncio: vaga publicada em jornal (Boston Globe, Chicago Tribune) que recebeu em geral quatro currículos
  sorteio_do_nome: atribuição aleatória do nome ao currículo dentro de cada anúncio
  discriminacao_estatistica: uso da raça como indício de produtividade não observada
  taxa_de_retorno: fração de currículos que receberam retorno
fontes:
  - Bertrand, M. & Mullainathan, S. (2004). Are Emily and Greg More Employable Than Lakisha and Jamal? American Economic Review 94(4), 991–1013 (citado de memória, por conferir)
  - Quillian, L., Pager, D., Hexel, O. & Midtbøen, A. (2017). Meta-analysis of field experiments shows no change in racial discrimination in hiring over time. PNAS 114(41), 10870–10875 (citado de memória, por conferir)
  - Kleiber, C. & Zeileis, A. (2008), pacote AER do R, base ResumeNames
  - data/h2/AER_ResumeNames.csv (Rdatasets AER::ResumeNames)
arquivos: [AER_ResumeNames.csv]
familia: binomial
desfecho: currículo recebeu retorno do empregador (1) ou não (0)
chave: afro
candidatos:
  afro: {tipo: num, descricao: nome de sonoridade afro-americana sorteado (1) ou branca (0)}
  feminino: {tipo: num, descricao: nome feminino}
  experiencia_log: {tipo: num, descricao: log(1 + anos de experiência)}
  honras: {tipo: num, descricao: currículo menciona honras acadêmicas}
  lacuna: {tipo: num, descricao: histórico com lacuna de emprego}
  email: {tipo: num, descricao: currículo traz endereço de e-mail}
  faculdade: {tipo: num, descricao: diploma universitário}
  habilidades_especiais: {tipo: num, descricao: lista habilidades especiais}
icp_candidatos: [afro, feminino, experiencia_log, honras, lacuna, email, faculdade, habilidades_especiais]
ajuste: [feminino, experiencia_log, honras, lacuna, email, faculdade, habilidades_especiais]
dag:
  - [afro, y]
  - [feminino, y]
  - [experiencia_log, y]
  - [honras, y]
  - [lacuna, y]
  - [email, y]
  - [faculdade, y]
  - [habilidades_especiais, y]
  - [experiencia_log, lacuna]
ambientes:
  descricao: >-
    cidade × banco de qualidade do currículo (chicago_alta, chicago_baixa, boston_alta, boston_baixa); Boston inteira
    fica no cofre, nunca vista. Escolha feita antes de qualquer resultado: o ICP compara só os dois bancos de qualidade
    de Chicago. A qualidade foi sorteada dentro do anúncio e é um rótulo dos pesquisadores, invisível ao empregador:
    muda a distribuição das características do currículo (X) sem, plausivelmente, mudar a lei de Y dado X. A cidade,
    ao contrário, age direto em Y (mercado de trabalho), e por isso fica só como teste fora do ambiente. Fraqueza: o
    banco alto difere também em atributos não registrados na base (certificações, idiomas), que viram pai oculto.
  cofre: [boston_alta, boston_baixa]
unidade: >-
  o anúncio de emprego: os ~4 currículos de um anúncio dividem empregador, vaga e recrutador. A base não traz o
  identificador do anúncio; usa-se o pseudoanúncio (cidade + exigências + ocupação + setor), um agrupamento mais grosso
  que o anúncio (684 grupos), o que torna o erro padrão agrupado conservador
cabecalho:
  processo_gerador: Para cada anúncio, os pesquisadores enviaram currículos de qualidade alta e baixa e sortearam nomes brancos ou afro-americanos entre eles; registraram se o empregador retornou.
  nao_linearidade: Probabilidade de retorno baixa (~8%), escala logística; experiência em log pelo retorno decrescente.
  unidade_e_margem: O anúncio é a unidade (aproximado pelo pseudoanúncio); margem com erro padrão agrupado.
  fisica_do_ruido: Bernoulli por currículo, com choque comum ao anúncio (o empregador que não contrata não liga para ninguém).
  escada_causal: Degrau 2 (intervenção sorteada). O nome sinaliza raça mas também classe social; o efeito estimado é o do nome, não o da raça em si.
shelf:
  quantidade: razão de chances de retorno, nome afro-americano contra nome branco
  escala: razao_de_chances
  fonte: >-
    meta-análise de experimentos de campo nos EUA (Quillian et al. 2017: brancos recebem ~36% mais retornos; razão de
    taxas ~1/1,36), convertida para razão de chances com taxa de base ~8%; citada de memória, por conferir. A meta-análise
    inclui o próprio Bertrand & Mullainathan, o que contamina levemente a priori. Nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  taxa_base: 0.08
  quartis: {q05: 0.55, q25: 0.66, q50: 0.74, q75: 0.82, q95: 0.97}
decisao:
  acao: adotar triagem anônima de currículos (sem nome) na primeira etapa de seleção
  beneficio_por_unidade: -100.0
  custo: 1.0
  custo_pesquisa: 0.05
  nota: >-
    utilidade em retornos-equivalentes por 100 candidaturas afro-americanas; θ (efeito marginal do nome na probabilidade
    de retorno) é negativo, e a triagem anônima recupera −100·θ retornos por 100 candidaturas, daí o benefício por
    unidade negativo. O custo (1 retorno-equivalente por 100 candidaturas, pela triagem extra) e o custo da pesquisa são
    suposições, a elicitar com o RH
termo_escopo:
  vale_para: triagem de currículos para vagas administrativas, de vendas e atendimento anunciadas em jornal em Boston e Chicago, 2001–2002
  nao_vale_para: etapas posteriores (entrevista, contratação, salário), recrutamento por indicação ou plataformas digitais, outros países, raça sinalizada por outros meios que não o nome
tentativas_de_especificacao: 1
tem_titulares: false
grupo_justica: afro
chave_atribuida: dentro_da_unidade   # sorteio dentro da unidade (fato do desenho); o F3 permuta dentro dela
