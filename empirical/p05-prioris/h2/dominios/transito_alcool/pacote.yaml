nome: transito_alcool
area: Saúde pública / transporte
titulo: Imposto sobre cerveja e mortes no trânsito nos estados dos EUA (1982–1988)
pergunta: Subir o imposto estadual sobre a cerveja reduz a mortalidade no trânsito dentro do mesmo estado, e o efeito estimado em três regiões vale para os estados do Nordeste?
alegacao: '"Estados com imposto mais alto sobre a cerveja têm mais mortes no trânsito, então o imposto não adianta" - o sinal ingênuo da comparação entre estados, que o efeito fixo de estado inverte.'
glossario:
  taxa_de_mortalidade: mortes em acidentes de trânsito por 10 mil habitantes no ano
  imposto_cerveja: imposto estadual sobre a cerveja em dólares de 1988 por caixa de 24 latas
  erosao_inflacionaria: queda do imposto real quando o imposto nominal fica parado e os preços sobem
  idade_minima_para_beber: idade legal mínima para comprar álcool (MLDA); a lei federal de 1984 pressionou todos para 21
  prisao_obrigatoria: pena mínima de prisão obrigatória já na primeira condenação por dirigir embriagado
  servico_comunitario: pena mínima obrigatória de serviço comunitário na primeira condenação
  efeito_fixo_de_estado: comparar cada estado consigo mesmo ao longo do tempo, removendo o que é permanente nele
  vies_de_variavel_omitida: distorção do coeficiente por um fator que afeta o imposto e as mortes ao mesmo tempo
  milhas_por_motorista: milhas rodadas por motorista no ano (milhares), exposição ao risco
  cinto_de_bebida: região do sul com impostos altos sobre álcool por tradição religiosa e estradas rurais perigosas
fontes:
  - "Ruhm (1996), Alcohol policies and highway vehicle fatalities, Journal of Health Economics 15 — citado de memória, por conferir"
  - "Stock & Watson, Introduction to Econometrics, cap. de dados em painel (exemplo Fatality) — citado de memória, por conferir"
  - "Chaloupka, Saffer & Grossman (1993), Alcohol-control policies and motor-vehicle fatalities, Journal of Legal Studies — citado de memória, por conferir"
  - "NHTSA, Fatality Analysis Reporting System (FARS), fonte primária das mortes"
  - data/h2/Ecdat_Fatality.csv (Rdatasets Ecdat::Fatality)
arquivos: [Ecdat_Fatality.csv]
familia: gaussiana
desfecho: >-
  mortes no trânsito por 10 mil habitantes, em desvio da média do próprio estado em 1982–1988 (transformação dentro;
  todos os candidatos numéricos recebem a mesma transformação)
chave: imposto_cerveja
candidatos:
  imposto_cerveja: {tipo: num, descricao: imposto real sobre cerveja (US$ de 1988 por caixa), desvio da média do estado}
  idade_minima: {tipo: num, descricao: idade mínima para beber, desvio da média do estado}
  prisao_obrigatoria: {tipo: num, descricao: lei de prisão obrigatória, desvio da média do estado}
  servico_comunitario: {tipo: num, descricao: lei de serviço comunitário obrigatório, desvio da média do estado}
  milhas_por_motorista: {tipo: num, descricao: milhares de milhas por motorista, desvio da média do estado}
  desemprego: {tipo: num, descricao: taxa de desemprego (%), desvio da média do estado}
  renda_log: {tipo: num, descricao: log da renda per capita (US$ de 1987), desvio da média do estado}
  ano: {tipo: cat, descricao: ano de 1982 a 1988 (choques nacionais comuns)}
icp_candidatos: [imposto_cerveja, idade_minima, prisao_obrigatoria, servico_comunitario, milhas_por_motorista, desemprego, renda_log, ano]
ajuste: [ano, idade_minima, prisao_obrigatoria, servico_comunitario, desemprego, renda_log, milhas_por_motorista]
dag:
  - [imposto_cerveja, y]
  - [ano, imposto_cerveja]
  - [ano, y]
  - [opiniao_publica, imposto_cerveja]
  - [opiniao_publica, idade_minima]
  - [opiniao_publica, prisao_obrigatoria]
  - [opiniao_publica, servico_comunitario]
  - [idade_minima, y]
  - [prisao_obrigatoria, y]
  - [servico_comunitario, y]
  - [desemprego, imposto_cerveja]
  - [desemprego, y]
  - [desemprego, milhas_por_motorista]
  - [renda_log, imposto_cerveja]
  - [renda_log, milhas_por_motorista]
  - [renda_log, y]
  - [milhas_por_motorista, y]
ambientes:
  descricao: >-
    Região do Census Bureau do estado (sul, centro-oeste, oeste no treino; nordeste, 9 estados, no cofre, nunca visto).
    Por que regiões: depois da transformação dentro do estado, o que é permanente na região (estradas rurais, tradição
    de bebida, o "cinto de bebida" do sul) sai de Y; o que a região ainda muda é a distribuição das variações do imposto
    (estados do sul com imposto nominal alto perdem mais com a inflação; outros legislaram aumentos) e das leis de
    álcool, isto é, age nos preditores. Violação plausível declarada: tendências regionais próprias (choque do petróleo
    de 1986 no sul e no oeste) agem em Y; desemprego e renda estão entre os candidatos para absorver parte disso.
    Anos como ambiente foram descartados porque o limite de velocidade de 65 mph de 1987 e a recessão de 1982 agem
    direto em Y.
  cofre: [nordeste]
unidade: >-
  o estado (48 estados contíguos); os 7 anos de um estado dividem política, estradas e população, e o imposto varia
  dentro do estado
cabecalho:
  processo_gerador: Cada estado fixa o imposto nominal sobre a cerveja e leis de álcool; a inflação corrói o imposto real; o preço da cerveja muda o consumo, sobretudo de jovens, e o consumo muda o risco de acidente fatal.
  nao_linearidade: Linear nos desvios dentro do estado; o efeito pode saturar em impostos altos, mas a variação dentro do estado é pequena (centavos a poucos dólares).
  unidade_e_margem: O estado é a unidade (39 estados no treino contra 273 estado-anos); erro padrão agrupado por estado. Com 39 grupos a margem é estreita.
  fisica_do_ruido: Contagem de mortes por população grande, aproximadamente gaussiana na taxa; ruído maior em estados pequenos (Wyoming, Vermont).
  escada_causal: "Degrau 1 (observacional, painel com efeito fixo). Premissa não testável: nada que mude dentro do estado e afete imposto e mortes ficou de fora além do declarado (a opinião pública age só pelas leis); o sinal ingênuo entre estados é positivo por confusão permanente."
shelf:
  quantidade: variação das mortes por 10 mil habitantes por US$ 1 a mais de imposto real por caixa, dentro do estado
  fonte: >-
    literatura de painel com efeito fixo de estado (Ruhm 1996; Chaloupka, Saffer & Grossman 1993; exemplo de Stock &
    Watson), citada de memória e por conferir; nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: -1.3, q25: -0.75, q50: -0.45, q75: -0.15, q95: 0.3}
decisao:
  acao: aumentar o imposto estadual sobre a cerveja em US$ 1 por caixa (dólares de 1988)
  beneficio_por_unidade: -10.0
  custo: 2.0
  custo_pesquisa: 0.1
  nota: >-
    utilidade em mortes evitadas por 100 mil habitantes-ano equivalentes; θ negativo (menos mortes) vira benefício,
    por isso beneficio_por_unidade = −10 (1 morte por 10 mil = 10 por 100 mil). O custo de bem-estar do imposto para
    quem bebe com moderação (2) e o custo de pesquisa (0,1) são suposições, não medidas
termo_escopo:
  vale_para: estados contíguos dos EUA nos anos 1980, aumentos moderados do imposto real sobre cerveja, mortalidade total no trânsito
  nao_vale_para: outros países, aumentos muito grandes, mortes só de jovens ou noturnas (não modeladas), décadas com outra frota e outras leis
tentativas_de_especificacao: 1
tem_titulares: false
