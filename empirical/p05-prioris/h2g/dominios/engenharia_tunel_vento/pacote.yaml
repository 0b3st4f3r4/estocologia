nome: engenharia_tunel_vento
area: Engenharia (aerodinâmica)
titulo: Pressão a jusante sob cargas de ventilador em passeio aleatório e intervenções em regimes (Causal Chambers, túnel de vento)
pergunta: >-
  A pressão a jusante é governada pelas cargas dos dois ventiladores, pela escotilha e pela sobreamostragem do seu
  barômetro com a mesma lei em todos os regimes, de modo que o que se aprende nos outros regimes preveja o regime
  em que a escotilha volta a abrir?
alegacao: '"A pressão segue os ventiladores do mesmo jeito em qualquer regime: rotação e corrente não acrescentam nada."'
glossario:
  tunel_de_vento: câmara com um ventilador de entrada e um de saída, uma escotilha e quatro barômetros
  carga: comando de potência de cada ventilador (load_in, load_out), de 0 a 1
  escotilha: abertura lateral (hatch), em graus; aberta, muda o escoamento
  barometro: sensor de pressão absoluta (Pa) a montante, a jusante, no ambiente e na entrada
  tacometro: medida da rotação de cada ventilador (rpm_in, rpm_out); res_* muda a resolução
  sobreamostragem: número de leituras que o sensor promedia (osr_*); muda o ruído, não a média
  passeio_aleatorio: as cargas mudam um passo por vez, de forma contínua ao longo do experimento
  regime: bloco de 10 000 medições com uma intervenção de alvo único, ou nenhuma
  desbaste: uma medição a cada 20, para reduzir a autocorrelação
  grafo_de_referencia: grafo causal publicado pelos autores, de atuadores e parâmetros para sensores
fontes:
  - "Gamella, Peters & Bühlmann (2025), Causal chambers as a real-world physical testbed for AI methodology, Nature Machine Intelligence — citada de memória, conferir; arXiv 2404.11341"
  - data/h2e/causal_chamber_wt_walks_v1_regime_jumps_single.csv (ver FONTES.md)
arquivos: [causal_chamber_wt_walks_v1_regime_jumps_single.csv]
familia: gaussiana
desfecho: pressão a jusante, padronizada pela média e pelo dp do treino
chave: load_in
candidatos:
  load_in: {tipo: num, descricao: carga do ventilador de entrada (0–1)}
  load_out: {tipo: num, descricao: carga do ventilador de saída (0–1)}
  hatch: {tipo: num, descricao: ângulo da escotilha (graus)}
  osr_downwind: {tipo: num, descricao: sobreamostragem do barômetro a jusante}
  rpm_in: {tipo: num, descricao: rotação medida do ventilador de entrada}
  rpm_out: {tipo: num, descricao: rotação medida do ventilador de saída}
  current_in: {tipo: num, descricao: corrente medida do ventilador de entrada}
  pressure_upwind: {tipo: num, descricao: pressão a montante (Pa)}
  pressure_intake: {tipo: num, descricao: pressão na entrada (Pa)}
  pressure_ambient: {tipo: num, descricao: pressão ambiente (Pa)}
icp_candidatos: [load_in, load_out, hatch, osr_downwind, rpm_in, rpm_out, current_in, pressure_upwind, pressure_intake, pressure_ambient]
ajuste: [load_out, hatch, osr_downwind]
dag:
  - [passeio, load_in]
  - [load_in, y]
  - [load_out, y]
  - [hatch, y]
  - [osr_downwind, y]
  - [load_in, rpm_in]
  - [load_out, rpm_in]
  - [hatch, rpm_in]
  - [load_in, rpm_out]
  - [load_out, rpm_out]
  - [hatch, rpm_out]
  - [load_in, current_in]
  - [load_out, current_in]
  - [load_in, pressure_upwind]
  - [load_out, pressure_upwind]
  - [hatch, pressure_upwind]
  - [load_in, pressure_intake]
  - [load_out, pressure_intake]
  - [hatch, pressure_intake]
ambientes:
  descricao: >-
    O regime (flag 0–31). Intervenções de alvo único em hatch, osr_* dos barômetros, res_* dos tacômetros, v_* das
    correntes e v_1/v_2 (irrelevantes para Y); seis regimes sem intervenção. hatch e osr_downwind agem em Y mas são
    candidatos medidos. O cofre é o regime 18 (hatch 0→45, segunda vez); o regime 5, com a mesma intervenção, está
    no treino. Uma medição a cada 20. Declarado em ../../DECLARACAO_H2e.md.
  cofre: [r18]
unidade: bloco de 50 medições consecutivas mantidas (1 000 brutas) dentro do regime; 10 por regime
cabecalho:
  processo_gerador: As cargas dos ventiladores fazem passeios aleatórios contínuos; a cada regime um parâmetro é posto num valor novo; o escoamento fixa as pressões, rotações e correntes.
  nao_linearidade: Pressão aproximadamente quadrática na rotação (lei dos ventiladores); a escotilha muda a perda de carga.
  unidade_e_margem: "Série temporal: medições autocorrelacionadas; desbaste de 1 em 20 e blocos de 50 como unidade."
  fisica_do_ruido: Ruído do barômetro (menor com mais sobreamostragem) e turbulência; possível deriva atmosférica lenta comum aos barômetros.
  escada_causal: "Degrau 2 (intervenções de alvo conhecido). Premissas não testáveis: o grafo de referência está completo, salvo a deriva atmosférica declarada."
shelf:
  quantidade: efeito de levar a carga de entrada de 0 a 1 na pressão a jusante, em dp de Y no treino
  fonte: >-
    argumento físico: duas cargas com peso parecido e passeios em [0, 1] dão θ ≈ 2,4; o ventilador de entrada
    pressuriza a câmara (sinal provável positivo). Nenhum especialista humano consultado
  painel: argumento físico; nenhum especialista humano consultado
  quartis: {q05: -1.0, q25: 1.0, q50: 2.0, q75: 3.0, q95: 4.5}
decisao:
  acao: usar a carga de entrada como alavanca para regular a pressão a jusante
  beneficio_por_unidade: 1.0
  custo: 2.0
  custo_pesquisa: 0.05
  nota: decisão inventada (como no Sachs), com custo perto da mediana da priori; o F1 aqui não informa sobre o mundo
termo_escopo:
  vale_para: o túnel de vento na configuração padrão, regimes de alvo único
  nao_vale_para: intervenções múltiplas simultâneas, outra câmara, cargas fora de [0, 1]
tentativas_de_especificacao: 1
historico_especificacoes:
  - K: 1
    quando: H2e (2026-10-15, declarado antes de rodar em ../../DECLARACAO_H2e.md)
    o_que: especificação original; ICP com o teste K = 2 e a regra de saturação K = 3 do H2d, sem mudança
tem_titulares: false
