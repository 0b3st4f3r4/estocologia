ambientes:
  descricao: >-
    Regime de fiscalização do cinto no estado-ano (no, secondary, primary). A lei intervém no uso do cinto (X);
    a pergunta do ICP é se ela age na mortalidade só por ele. "primary" fica no cofre, nunca visto; o treino tem
    só 2 ambientes (no, secondary), o que dá pouco poder ao ICP (limite declarado). O efeito permanente do estado sai
    pela transformação within (H2d, K = 3): y e candidatos menos a média de treino do estado. Violações plausíveis declaradas: compensação de risco (a lei muda o jeito de
    dirigir, não só o cinto, que é o tema de Cohen & Einav); fiscalização primária vem junto de mais blitz em geral;
    estados que aprovam leis cedo diferem em tendência.
  cofre: [primary]
unidade: o estado (51 com DC); os anos de um estado dividem estradas, frota e polícia
cabecalho:
  processo_gerador: Estados aprovam leis de cinto (secundária, depois às vezes primária) em anos diferentes; o uso declarado sobe; a mortalidade por milha cai com o uso, com a frota e com a tendência nacional.
  nao_linearidade: Linear no uso e no ano sobre o log da mortalidade relativa à linha de base; o efeito do uso pode ser côncavo (os últimos a aderir dirigem pior).
  unidade_e_margem: O estado é a unidade (≈ 50 no treino); erro padrão agrupado por estado. H2d (K = 3) - y e todos os candidatos centrados na média de treino do estado (efeito fixo).
  fisica_do_ruido: Contagem de mortes sobre milhas, ruído de Poisson grande em estados pequenos; uso do cinto é autodeclarado (erro de medida que atenua o coeficiente).
  escada_causal: "Degrau 1 a 2 (leis em datas diferentes, mas não sorteadas). Premissas não testáveis: a lei não muda a mortalidade por outro canal além do uso; a autodeclaração do uso não muda com a lei."
shelf:
  quantidade: variação do log da mortalidade por milha por unidade de uso do cinto (0 → 100%)
  fonte: >-
    Cohen & Einav (2003): 10 pontos de uso a mais reduzem a mortalidade de ocupantes em ~1–2% sem sinal de
    compensação de risco; eficácia do cinto contra morte de ocupante dianteiro ~45% (NHTSA). Citados de memória,
    conferir; nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: -0.45, q25: -0.25, q50: -0.15, q75: -0.07, q95: 0.05}
decisao:
  acao: passar da fiscalização secundária para a primária (≈ +10 pontos de uso)
  beneficio_por_unidade: -10.0
  custo: 1.0
  custo_pesquisa: 0.05
  nota: >-
    utilidade em pontos percentuais de mortalidade evitada: +0,1 de uso muda o log-mortalidade em 0,1·θ, ou 10·θ
    pontos percentuais (θ negativo vira benefício, por isso −10); o custo de 1 ponto equivale ao custo de
    fiscalização e de liberdade (suposição, não medida)
termo_escopo:
  vale_para: estados dos EUA entre 1983 e 1997, uso do cinto entre ~30% e ~90%, mortalidade total por milha
  nao_vale_para: outros países, uso acima de 90%, frotas com airbag universal, mortes só de ocupantes (não separadas aqui)
tentativas_de_especificacao: 3
historico_especificacoes:
  - K: 1
    quando: H2b (2026-10-14)
    o_que: especificação original; ICP com o teste linear gaussiano (F aninhado + Levene, Bonferroni)
  - K: 2
    quando: H2c (2026-10-14, declarado antes de rodar em ../h2b/DECLARACAO_K2.md)
    o_que: >-
      só o teste de invariância do ICP muda, igual nos 5 domínios: um ajuste agrupado (X discreto como fator,
      contínuo linear + spline restrita de 4 nós), resíduo padronizado por escala agrupada, Kruskal–Wallis +
      Brown–Forsythe entre ambientes, Bonferroni; Y, X, ambientes, cofre, DAG, ajuste, priori e decisão iguais
    por_que: >-
      o teste K = 1 rejeita com n grande qualquer desvio do modelo linear gaussiano (X discreto com resposta
      não linear, cauda pesada, variância que depende de X), mesmo com a lei de Y dado X invariante
  - K: 3
    quando: H2d (2026-10-14, declarado antes de rodar em ../DECLARACAO_K3.md)
    o_que: >-
      regra de saturação no ICP, igual nos 5 domínios: um S cujo ambiente é função determinística das colunas de S
      (acerto 1-NN deixando a linha de fora ≥ 0,99) sai da família (nem aceito nem rejeitado); Ŝ é a interseção dos
      aceitos não saturados. Teste K = 2 e todo o resto iguais
    por_que: >-
      com X_S que determina o ambiente, Y ⊥ E | X_S vale por construção e o teste tem poder zero; um teste sem
      poder não certifica invariância (o Ŝ do RAND no K = 2 vinha só disso)
  - K: 3
    quando: H2d (2026-10-14, mesma declaração)
    o_que: >-
      efeito fixo de estado pela transformação within: y e os 9 candidatos menos a média de treino do próprio estado
      (regimes no e secondary); o cofre é centrado com as médias de treino do estado; trafego_log = log milhas −
      média de treino do estado. Unidade, ambientes, cofre, DAG, ajuste, priori e decisão iguais
    por_que: >-
      o F2 do H2b podou por EP agrupado 0,140 > dp da priori 0,133 com efeito de desenho 6,1; a linha de base de 2
      anos (1983–1984) deixa um ruído constante por estado no y e não tira o nível de estado dos X; o efeito fixo
      de estado é a especificação padrão de painel (Cohen & Einav 2003 — citada de memória, conferir); escolhida sem
      rodar alternativas; o ICP diagnóstico do H2b (K = 1) já era conhecido
tem_titulares: false
