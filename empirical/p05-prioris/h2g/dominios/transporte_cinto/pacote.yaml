  - [ano, idade21]
  - [ano, alcool008]
  - [ano, renda_log]
  - [ano, trafego_log]
  - [renda_log, uso_cinto]
  - [renda_log, trafego_log]
  - [renda_log, y]
  - [idade_media, uso_cinto]
  - [idade_media, y]
  - [uso_cinto, y]
  - [vel65, y]
