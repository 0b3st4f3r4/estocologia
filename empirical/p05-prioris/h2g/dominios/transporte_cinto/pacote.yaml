nome: transporte_cinto
area: Transporte (segurança viária)
titulo: Uso do cinto de segurança e mortalidade no trânsito sob leis de fiscalização (50 estados + DC, 1983–1997)
pergunta: >-
  Quanto a mortalidade no trânsito cai por ponto de uso do cinto, e a lei da mortalidade dado o uso do cinto vale
  nos estados-ano com fiscalização primária, um regime que não entrou no ajuste?
alegacao: '"O cinto salva o mesmo tanto por ponto de uso, seja qual for a lei que levou as pessoas a usá-lo: a fiscalização primária só vale pelo uso que gera."'
glossario:
  fiscalizacao_primaria: a polícia pode parar o carro só porque alguém está sem cinto
  fiscalizacao_secundaria: a multa por falta de cinto só vem junto de outra infração
  uso_do_cinto: fração de ocupantes que declaram usar o cinto (pesquisa estadual)
  compensacao_de_risco: motorista protegido pelo cinto dirige com menos cuidado (hipótese de Peltzman)
  mortalidade_por_milha: mortes no trânsito por milhão de milhas percorridas
  linha_de_base: "até o H2c, a média de 1983–1984 do estado; no H2d (K = 3), a média de treino do estado (efeito fixo, transformação within)"
  limite_de_velocidade_65: limite de 65 mph nas rodovias rurais, permitido a partir de 1987
  idade_minima_21: idade mínima de 21 anos para comprar bebida
  limite_alcoolemia_008: limite de 0,08 g/dL de álcool no sangue para dirigir
  painel_estadual: as mesmas unidades (estados) observadas ano a ano
fontes:
  - "Cohen & Einav (2003), The effects of mandatory seat belt laws on driving behavior and traffic fatalities, Review of Economics and Statistics 85:828 — citada de memória, conferir"
  - "Peltzman (1975), The effects of automobile safety regulation, Journal of Political Economy 83:677 — citada de memória, conferir"
  - "Stock & Watson, Introduction to Econometrics, 2ª ed., exercício empírico com USSeatBelts — citado de memória, conferir"
  - data/h2b/AER_USSeatBelts.csv (Rdatasets AER::USSeatBelts)
arquivos: [AER_USSeatBelts.csv]
familia: gaussiana
desfecho: >-
  H2d (K = 3): log das mortes por milhão de milhas menos a média do próprio estado nas linhas de treino (regimes no e
  secondary; efeito fixo de estado pela transformação within; nunca usa o cofre)
chave: uso_cinto
candidatos:
  uso_cinto: {tipo: num, descricao: fração declarada de uso do cinto (0 a 1)}
  ano: {tipo: num, descricao: ano calendário (tendência de frota, medicina de emergência)}
  renda_log: {tipo: num, descricao: log da renda mediana per capita (dólares correntes)}
  idade_media: {tipo: num, descricao: idade média da população}
  vel65: {tipo: num, descricao: limite de 65 mph}
  vel70: {tipo: num, descricao: limite de 70 mph ou mais}
  idade21: {tipo: num, descricao: idade mínima de 21 anos para beber}
  alcool008: {tipo: num, descricao: limite de alcoolemia de 0,08}
  trafego_log: {tipo: num, descricao: log das milhas percorridas menos a média de treino do estado (H2d; antes, a de 1983–1984)}
icp_candidatos: [uso_cinto, ano, renda_log, idade_media, vel65, vel70, idade21, alcool008, trafego_log]
ajuste: [ano, renda_log, idade_media, vel65, vel70, idade21, alcool008, trafego_log]
dag:
  - [lei_cinto, uso_cinto]
  - [opiniao_seguranca, lei_cinto]
  - [opiniao_seguranca, idade21]
  - [opiniao_seguranca, alcool008]
  - [opiniao_seguranca, vel65]
  - [opiniao_seguranca, vel70]
  - [ano, lei_cinto]
  - [ano, uso_cinto]
