nome: farmacologia_qt
area: Farmacologia clínica (cardiologia)
titulo: QTcF sob dofetilida, quinidina, ranolazina, verapamil e placebo em voluntários saudáveis (FDA, ECGRDVQ)
pergunta: >-
  O QTcF é governado pelas concentrações plasmáticas das drogas que bloqueiam o hERG com a mesma lei em todos os
  braços do ensaio, de modo que essa lei preveja o QTcF sob o verapamil, nunca visto?
alegacao: '"O QT segue a concentração da droga do mesmo jeito em qualquer braço; o PR e a onda T não acrescentam nada."'
glossario:
  qtcf: intervalo QT corrigido pela frequência cardíaca pela fórmula de Fridericia, QT/RR^(1/3), em ms
  herg: canal de potássio cuja inibição prolonga a repolarização ventricular e o QT
  dofetilida: antiarrítmico que bloqueia só o hERG
  quinidina: antiarrítmico que bloqueia hERG e canais de sódio
  ranolazina: antianginoso que bloqueia hERG e a corrente tardia de sódio
  verapamil: bloqueador de cálcio tipo L que também bloqueia hERG; efeito pequeno no QTc
  pr: intervalo da condução atrioventricular; desfecho paralelo, não causa do QT
  onda_t: componente da repolarização no ECG; amplitude, achatamento e assimetria
  histerese: atraso entre a concentração plasmática e o efeito no ECG
  ensaio_cruzado: cada voluntário recebe todos os tratamentos em períodos separados por intervalo de eliminação
fontes:
  - "Johannesen et al. (2014), Differentiating drug-induced multichannel block on the electrocardiogram, Clin Pharmacol Ther 96:549 — citada de memória, conferir"
  - data/h2g/ecgrdvq/SCR-002.Clinical.Data.csv (PhysioNet ECGRDVQ, espelho AWS; ver FONTES.md)
arquivos: [ecgrdvq/SCR-002.Clinical.Data.csv]
familia: gaussiana
desfecho: QTcF médio do triplo de ECGs, em ms
chave: c_dof
candidatos:
  c_dof: {tipo: num, descricao: concentração plasmática de dofetilida (ng/mL); 0 fora do braço}
  c_qui: {tipo: num, descricao: concentração plasmática de quinidina (ng/mL)}
  c_ran: {tipo: num, descricao: concentração plasmática de ranolazina (ng/mL)}
  rr: {tipo: num, descricao: intervalo RR médio (ms)}
  pr: {tipo: num, descricao: intervalo PR médio (ms)}
  tamp: {tipo: num, descricao: amplitude da onda T (µV)}
  sexo: {tipo: num, descricao: feminino (1) ou masculino (0)}
  idade: {tipo: num, descricao: idade em anos}
  peso: {tipo: num, descricao: peso em kg}
icp_candidatos: [c_dof, c_qui, c_ran, rr, pr, tamp, sexo, idade, peso]
ajuste: [c_qui, c_ran, rr, sexo, idade, peso]
dag:
  - [sorteio, c_dof]
  - [c_dof, y]
  - [c_qui, y]
  - [c_ran, y]
  - [c_qui, rr]
  - [rr, y]
  - [sexo, y]
  - [idade, y]
  - [peso, y]
  - [c_dof, pr]
  - [c_qui, pr]
  - [c_ran, pr]
  - [c_dof, tamp]
  - [c_qui, tamp]
  - [c_ran, tamp]
  - [y, tamp]
ambientes:
  descricao: >-
    O braço sorteado do ensaio cruzado: placebo, dofetilida, quinidina e ranolazina no treino; o verapamil no cofre
    (intervenção forte com efeito pequeno no QTc e efeito no PR). Os mesmos 22 voluntários em todos os braços.
    Violações declaradas: linhas dependentes (16 instantes por voluntário), histerese, metabólitos não medidos.
    Ver ../../DECLARACAO_H2g.md.
  cofre: [verapamil]
unidade: o voluntário (22); 16 instantes por braço
cabecalho:
  processo_gerador: Dose única por período; a concentração sobe e cai ao longo de 24 h; o bloqueio de canais iônicos acompanha a concentração e muda os intervalos do ECG.
  nao_linearidade: Aproximadamente linear em concentração na faixa de dose única (modelo concentração–QTc do FDA); histerese pequena.
  unidade_e_margem: O voluntário é a unidade; 16 instantes e 4 braços de treino por voluntário.
  fisica_do_ruido: Variação diurna e de medida do ECG, reduzida pela média do triplo; aproximadamente gaussiana.
  escada_causal: "Degrau 2 (braços sorteados com alvo farmacológico conhecido). Premissa não testável: a concentração medida resume a ação da droga (metabólitos ativos violam em parte)."
shelf:
  quantidade: inclinação do QTcF na concentração de dofetilida (ms por ng/mL), ajustada pelas outras concentrações, RR, sexo, idade e peso
  fonte: >-
    pico de ~2–3 ng/mL com 500 µg e ΔQTc de ~70–80 ms no pico, logo ~25–35 ms por ng/mL; citado de memória, não
    conferido; nenhum especialista humano consultado
  painel: literatura (de memória); nenhum especialista humano consultado
  quartis: {q05: 8.0, q25: 20.0, q50: 28.0, q75: 36.0, q95: 50.0}
decisao:
  acao: usar a concentração de dofetilida como alavanca de dose para o QTc
  beneficio_por_unidade: 1.0
  custo: 28.0
  custo_pesquisa: 0.5
  nota: decisão inventada, custo perto da mediana da priori; o F1 aqui não informa sobre o mundo
termo_escopo:
  vale_para: voluntários saudáveis, dose única oral, as quatro drogas do ensaio, 0 a 24 h
  nao_vale_para: pacientes, doses repetidas, outras drogas, metabólitos ativos em concentração alta
tentativas_de_especificacao: 1
historico_especificacoes:
  - K: 1
    quando: H2g (2026-10-15, declarado antes de rodar em ../../DECLARACAO_H2g.md)
    o_que: especificação original; ICP com o teste K = 2 e a regra K = 3 do H2d, sem mudança
tem_titulares: false
