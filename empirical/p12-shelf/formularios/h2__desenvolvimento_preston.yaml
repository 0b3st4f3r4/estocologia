      brier_climatologia: 0.250000
      habilidade: 0.650000
      portao: "ajustado (declaracao 1 do ponto 12): 5 caixas de massa igual, ECE <= 0,25; o portao como escrito (10 caixas, ECE <= 0,10) reprovaria"
