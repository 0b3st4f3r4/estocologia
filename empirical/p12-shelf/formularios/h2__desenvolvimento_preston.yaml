      murphy_res: 0.204545
      murphy_unc: 0.250000
      criterio_1_habilidade_positiva: "sim (0,6500)"
      criterio_2_ece_ate_0_10: "nao no portao como escrito (0,2750 em 10 caixas); sim no ajustado (0,2250 em 5 caixas)"
      criterio_3_sem_caixa_com_n4_e_0_25: "sim: o maior |desvio| e 0,2500, exatamente no limiar, e ele nao e ultrapassado"
      criterio_4_curva_fracamente_monotona: "sim, e inerte como escrito; o diagnostico que morde (taxa observada da caixa de cima acima da de baixo) tambem da sim"
      resultado: "aprovado no portao ajustado; reprovado no portao como escrito"
      falha_de_execucao_declarada: "o arquivo do pool mudou depois do congelamento da lista: os itens 16 e 17 da lista congelada (P20 e P19 na versao final) foram trocados pelo executor. As perguntas administradas foram as congeladas, e o gabarito desses dois foi reconstruido na fonte primaria (Banco Mundial: Russia 78,170 - 68,240 = 9,930 anos, logo nao; India 67,282 anos em 2021, logo sim) e coincide com o da versao nova"
      observacao_do_facilitador: "o especialista usou so dois valores de p (0,25 e 0,75), o minimo de granularidade: a habilidade de 0,65 vem da discriminacao (RES 0,2045) e nao da calibracao fina (REL 0,0420), e a ECE de 0,2250 fica perto do limiar por construcao, porque as caixas comparam 0,25/0,75 com taxas observadas de 0 e 1. Com 20 itens e duas probabilidades, o pre-teste mede direcao, nao calibracao fina"
    elicitacao:                    # ordem fixa: mediana -> quartis -> extremos
      q50: 4.5   # elicitado em 2026-10-16, mediana primeiro
      q25: 3.25   # elicitado em 2026-10-16, depois do q50
      q75: 5.75   # elicitado em 2026-10-16, depois do q50
      q05: 1.25   # elicitado em 2026-10-16, passo dos extremos
      q95: 7.75   # elicitado em 2026-10-16, passo dos extremos
      justificativa: "Preston (1975) e Deaton (2003): a inclinacao log-linear em corte transversal costuma girar entre 4 e 6 anos de vida por unidade de log do PIB per capita; os quartis abrem 3,25 a 5,75 e as caudas 1,25 a 7,75 para dar conta da sensibilidade a especificacao num painel de 142 paises — a variacao entre paises sustenta coeficientes mais altos, e o controle por efeitos fixos (instituicoes e geografia) e o erro de medida no PIB comprimem para baixo"
      fonte: "Preston (1975); Deaton (2003), citados pelo especialista na propria justificativa"
    controles:
      ordem_recebida: "mediana_primeiro"   # um so especialista: nao ha metade do painel na ordem inversa, declarado
      ancora_S: "4,5 (a mediana da primeira rodada) e 3,25 (a mediana confirmada)"
      ancora_p_com_S_mediana_propria: 0.50   # declarado para S = 3,25; a priori preve 0.5000, desvio 0.0000
      ancora_deslocamento_dp: null   # a leitura com a mediana do grupo e degenerada: o grupo e o proprio especialista
      razao_largura_90_elicitada_sobre_implicada: 1.0252   # elicitada 7.5000 / implicada 7.3160, na rodada confirmada
      excesso_de_confianca_ok: "sim"
    devolucao:
      rodada_1_em: "2026-10-16, na mesma sessao da elicitacao"
      rodada_1_confirmacao: "ajusta"     # rodada 1: o especialista ajustou, com motivo escrito
      rodada_1_ajuste_q05_q95: [-0.50, 7.00]
      rodada_1_motivo: "a primeira rodada apoiou demais a curva de Preston em corte transversal (~4 a 6 anos) e subestimou o efeito de analisar os 142 paises ao longo de 12 ondas; a referencia de Pritchett & Summers (1996) lembra que, dentro do pais, descontando caracteristicas fixas e ganhos tecnologicos globais em saude, o efeito direto da renda cai e ganha incerteza; a mediana recua para 3,25, meio-termo entre o corte transversal e a literatura de painel, e a dispersao abre para acomodar o centro dela sem descartar efeito nulo ou levemente negativo na ponta inferior"
      rodada_2_em: ""
      rodada_2_confirmacao: "nao houve"     # nada ficou em divergencia: extremos largos, mediana na mesma ordem, controles dentro do limite
      rodada_2_motivo: ""
      rodada_1_mostrado:            # o que o facilitador devolveu, na letra do protocolo
        numeros_do_especialista: "q05 1,25 | q25 3,25 | q50 4,5 | q75 5,75 | q95 7,75"
        faixa_anonima_do_grupo: "degenerada: o painel tem 1 especialista, entao minimo = mediana = maximo = 4,5"
        priori_de_literatura_p05: "q05 -2,746195205080443 | q25 -0,21995975644268073 | q50 1,536 | q75 3,291959756442681 | q95 5,818195205080443 (Pritchett & Summers 1996, regra R1, ponto 1,536 e dp 2,603)"
        ajuste_da_literatura_pelo_mesmo_instrumento: "media 1,536000 | dp 2,603390 | razao da largura 90% 1,0000"
        comparacao: "q50 elicitado 3,0 anos acima do de literatura; dp elicitado 1,8533 contra 2,6034, ou seja, a priori do especialista e mais estreita que a da literatura"
    ajuste_confirmado:            # o ajuste dos quantis confirmados na rodada 1
      familia: "gaussiana"
      media: 3.250000
      dp: 2.223903
      erro_max_quartis: 0.0
      largura_90_elicitada: 7.5000
      largura_90_implicada: 7.3160
      razao: 1.0252
      comando: "cargo run --release --bin labs -- --elicitacao -0.5,1.75,3.25,4.75,7.0"
    quartis_confirmados:
