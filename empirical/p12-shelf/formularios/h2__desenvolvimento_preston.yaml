        - {item: P01, p: 0.75, y: sim}
        - {item: P06, p: 0.25, y: nao}
        - {item: P18, p: 0.25, y: nao}
        - {item: P10, p: 0.25, y: nao}
        - {item: P07, p: 0.75, y: sim}
        - {item: P22, p: 0.25, y: nao}
