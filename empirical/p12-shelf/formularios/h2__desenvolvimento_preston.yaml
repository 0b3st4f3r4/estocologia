        - {item: P17, p: 0.75, y: sim}
        - {item: P11, p: 0.75, y: sim}
        - {item: P21, p: 0.75, y: sim}
        - {item: P02, p: 0.25, y: nao}
        - {item: P14, p: 0.25, y: nao}
        - {item: P13, p: 0.75, y: sim}
        - {item: P08, p: 0.25, y: nao}
        - {item: P20-frozen, p: 0.25, y: nao}
        - {item: P19-frozen, p: 0.75, y: sim}
        - {item: P04, p: 0.25, y: nao}
        - {item: P12, p: 0.25, y: nao}
        - {item: P15, p: 0.25, y: sim}
