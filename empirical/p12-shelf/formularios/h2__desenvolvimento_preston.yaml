# Formulário SHELF do domínio h2/desenvolvimento_preston — em branco.
# Regras, critérios e limiares estão em empirical/p12-shelf/protocolo.md; não se repete nada aqui.
# Quem preenche é gente. Nenhum campo abaixo foi preenchido por quem escreveu o protocolo.
# Nenhum número do domínio (priori do pacote, quartis de literatura do p05, saída do funil) entra na mesa
# antes de o especialista escrever os cinco quantis: os quartis de partida ficam em prioris_elicitadas.yaml.
# Não reescrever linha já preenchida: ajuste posterior entra como linha nova, datada, dentro do bloco.

protocolo: empirical/p12-shelf/protocolo.md
protocolo_sha256: "175004ac45caa0fc8e231ea0bd85466b913ef7da104f3d0c4d394cb7e6e95058"
declaracao_do_painel_sha256: ""   # hash da declaração congelada antes do primeiro pré-teste

dominio: h2/desenvolvimento_preston
horizonte: h2
area: "Desenvolvimento"
pacote: h2/dominios/desenvolvimento_preston/pacote.yaml
familia: "gaussiana"
escala: natural
chave: log_pib
quantidade: "anos de expectativa de vida por unidade de log natural do PIB per capita"
unidade_independente: "o país (142); as 12 ondas de um país dividem instituições, geografia e erros de medida"
desfecho: "expectativa de vida ao nascer (anos)"
decisao_em_jogo: "priorizar crescimento da renda (em vez de programas de saúde diretos) como via para aumentar a expectativa de vida"
acao_na_rodada_a: "adotar"
status_na_rodada_a: "aprovado"
K_de_hoje: "1"
K_de_hoje_fonte: h2/saida/desenvolvimento_preston/resultados.json

facilitador: "agente executor do repositorio (conduz, guarda o gabarito e nao elicita)"

pre_teste:
  itens: 20
  semente_do_sorteio: "2026"
  pool: ""                        # de onde vieram os 20 itens já resolvidos
  fora_do_cofre_do_dominio: "sim: fatos publicos de desenvolvimento, saude populacional e renda, nenhum medindo a quantidade elicitada"
  gabarito_com: "Banco Mundial (API v2) em 20 itens, com conferencia cruzada por Our World in Data (UN WPP e UN IGME), IBGE, CDC/NCHS, Rosstat e OMS/GHED"

especialistas:
  E1:
    nome: "sil"
    codigo: "E1"
    qualificacao: "autor do livro e do programa"
    de_fora_do_programa: "nao"        # o proprio autor: o controle principal do protocolo segue ausente
    de_fora_da_area_do_dominio: "nao"
