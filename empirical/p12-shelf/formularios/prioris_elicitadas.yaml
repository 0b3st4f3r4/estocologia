# EXEMPLO — preenchido com a PRIORI DE LITERATURA do p05. NÃO é elicitação.
#
# Para que serve: (1) fixar o formato que a elicitação do painel vai preencher; (2) servir de linha de
# comparação em comparacao.md. Os valores foram copiados de empirical/p05-prioris/prioris/{h2,h2g,h1-real}/literatura.yaml
# ("copiado e conferido" — seção 6 do protocolo) e conferidos no arquivo.
#
# Como o painel entra: quando a elicitação terminar, cada domínio ganha um bloco NOVO (elicited:), com os quartis
# confirmados, o ajuste e o hash da declaração do painel — ver formularios/<horizonte>__<dominio>.yaml, chave
# "consenso". Este arquivo NÃO é reescrito: o bloco novo entra ao lado, datado. Nada aqui é resposta de especialista.
#
# Escala: nos domínios binomiais (h2/direito_prisoes) os quartis são razão de chances e o ajuste toma o log
# (h2f/estocologia/dominio.py, priori_da_chave). No H1 real a quantidade é frequência e o ajuste é Beta
# (h2f/estocologia/estat.py, ajustar_beta_quartis).
#
# Fonte do protocolo: empirical/p12-shelf/protocolo.md (critérios, pré-teste, controles e limiares).

versao: exemplo_literatura_p05
data_da_copia: 2026-10-15
e_elicitation: false            # este arquivo, hoje, NÃO é elicitação
protocolo: empirical/p12-shelf/protocolo.md
protocolo_sha256: ""            # em branco: o congelamento não foi feito por quem copiou

