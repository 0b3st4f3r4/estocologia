itens_descartados:
  - enunciado: "No ano-base 2019, a taxa de encarceramento de pessoas latinas nas prisões estaduais dos Estados Unidos era mais de duas vezes a taxa de pessoas brancas?"
    motivo: "Dois números publicados discordam sobre a resposta, e o descarte segue a regra 4: a Sentencing Project (prisões estaduais, 2019) publica 349 contra 261 por 100.000, razão de 1,3, enquanto o BJS, com prisões estaduais e federais no mesmo ano, publica 763 contra 263, razão de 2,9. A resposta muda com a fonte, então o item sai."
  - enunciado: "No ano-base 2005, 68% dos presos libertados nos Estados Unidos foram presos novamente em até 3 anos?"
    motivo: "Número conferido em fonte estável (BJS, 2018 Update on Prisoner Recidivism, NCJ 250975), mas a coorte é de presos libertados em 2005, fora da janela de ano-base 2015-2024 exigida pelo pool."
  - enunciado: "No ano-base 2008, a maioria dos presos libertados em 24 estados dos Estados Unidos foi presa novamente em até 10 anos?"
    motivo: "A coorte de referência é de 2008 (BJS, Recidivism of Prisoners Released in 24 States in 2008: A 10-Year Follow-Up), fora da janela de ano-base; além disso o PDF do BJS não foi servido na conferência (a URL do documento devolveu HTML, e não o relatório), o que impediu a conferência exigida."
  - enunciado: "No ano-base 2024, o custo anual do sistema de justiça criminal dos Estados Unidos era de pelo menos 182 bilhões de dólares?"
    motivo: "O número de 182 bilhões de dólares repetido na página de 2024 vem da análise de 2017 da própria Prison Policy Initiative (Following the Money of Mass Incarceration, dados de exercício de 2015), e a nota de rodapé declara que faltam custos importantes; o ano-base do número fica ambíguo, então o item sai."
  - enunciado: "No ano-base 2022, as famílias de pessoas presas nos Estados Unidos gastavam 13.607 dólares por ano com taxas, telefonemas e visitas (Vera Institute of Justice, The Hidden Cost of Incarceration)?"
    motivo: "A vera.org não serviu o relatório na conferência: a página de publicação devolveu 404 e as demais URLs caíram na página inicial do instituto. Sem o número lido na fonte, o item não entra."
  - enunciado: "No ano-base 2019, cerca de 26% das pessoas presas nos Estados Unidos eram negras, segundo os relatórios de prisões do FBI?"
    motivo: "As tabelas do Uniform Crime Reports (ucr.fbi.gov, tabela 43 de 2019) responderam 403 a toda tentativa de busca; sem número conferido na fonte, o item não entra."
  - enunciado: "No ano-base 2021/2022, as admissões em detenção provisória (remand) no Canadá superaram as admissões em pena de prisão?"
    motivo: "O Statistics Canada respondeu 403 a todas as URLs tentadas (nota do Daily e artigo do Juristat sobre serviços correcionais), de modo que o número não pôde ser conferido na fonte."
  - enunciado: "No ano-base 2024, a Hungria tinha a maior taxa de prisioneiros por 100.000 habitantes da União Europeia?"
    motivo: "Conferido e verdadeiro (193 por 100.000, à frente de Polônia com 191), mas redundante com D06 e D13, que usam a mesma tabela do Eurostat; fica guardado para uma segunda rodada e não entra nos 24."
  - enunciado: "Itens sobre Toronto 1997-2002, Toronto 2020-2021, Rhode Island 2005-2015, Kochel, Wilson e Mastrofski (2011) e o experimento de LaLonde/NSW"
    motivo: "Proibidos pelo enunciado do pool: a resposta desses itens está no próprio repositório do projeto (governance/GRUPOS.md, capítulos do livro) e no domínio que vai ser elicitado, o que gastaria o cofre e contaminaria o pré-teste."
  - enunciado: "No ano-base 2023, a taxa de ocupação dos centros penitenciários federais do México era maior que 100%?"
    motivo: "Conferido e falso (a taxa foi 73,1 nos centros federais, contra 105,9 nos estaduais), mas o item repete o tema de superlotação já usado em D21 e D36; fica guardado para uma terceira rodada."
  - enunciado: "No ano-base 2019, a taxa de mortalidade nas prisões estaduais dos Estados Unidos era maior que 350 óbitos por 100.000 presos?"
    motivo: "O próprio relatório traz dois números para o mesmo ano: 330 óbitos por 100.000 presos estaduais e, na comparação com a população geral, 308 por 100.000 (e 435 por 100.000 para a população adulta ajustada). Como a resposta depende de qual leitura se usa, o item sai pela regra 4."
  - enunciado: "No ano-base 2018, mais de 60% das mortes nas cadeias locais dos Estados Unidos ocorreu nas primeiras sete dias após a admissão?"
    motivo: "Conferido e falso (cerca de 40% em 2018), mas o item repete o tema de mortes sob custódia já ocupado por D34, D35 e D38."
  - enunciado: "No ano-base 2022, o valor mediano da fiança (bail bond) para crime grave nos Estados Unidos era maior que 20.000 dólares?"
    motivo: "A página da Prison Policy Initiative de 2024 informa 10.000 dólares de fiança mediana para crime grave, mas remete a estudo anterior e não fixa um ano-base na página; sem ano-base definido, o item não entra (regra 2)."
  - enunciado: "No ano-base 2024, o salário médio por hora do trabalho prisional nos Estados Unidos era maior que 2 dólares?"
    motivo: "A Prison Policy Initiative publica faixas por estado (por exemplo, de 0,13 a 0,52 dólar por hora em presídios estaduais), mas a média nacional que ela cita vem do levantamento de 2017 com dados de 2001; o ano-base fica fora da janela 2015-2024."
  - enunciado: "No ano-base 2024, mais da metade dos Estados-membros da União Europeia tinha prisões superlotadas?"
    motivo: "O Eurostat publica 13 países com superlotação e 14 com capacidade ociosa, mas o número de países respondentes não é fixado no texto; a resposta passa a depender do denominador, e o enunciado deixa de ser inequívoco (regra 1)."
