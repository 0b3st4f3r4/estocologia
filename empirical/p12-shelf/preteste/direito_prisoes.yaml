    numero: "1,9 preso por funcionário penitenciário na União Europeia em 2024, razão que se mantém em 1,9 desde 2022 e que chegou a 1,8 em 2020 e 2021"
    fonte_url: "https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Prison_occupancy_statistics"
    fonte_titulo: "Prison occupancy statistics, Eurostat Statistics Explained (dados extraídos em abril de 2026, série de 2024)"
    ano_base: 2024
    dificuldade: dificil
  - id: D38
    enunciado: "No ano-base 2023, mais de 200 pessoas privadas de liberdade morreram em incidentes nos centros penitenciários e centros especializados do México?"
    resolucao: nao
    numero: "100 pessoas morreram e 892 ficaram feridas nos 3.094 incidentes registrados em 2023, com 6.538 pessoas envolvidas; homicídios e suicídios não são contados como incidentes pelo comunicado"
    fonte_url: "https://www.inegi.org.mx/contenidos/saladeprensa/boletines/2024/CNSIPEE-F/CNSIPEE-F2024.pdf"
    fonte_titulo: "Censos Nacionales de Sistemas Penitenciarios en los Ámbitos Estatal y Federal (CNSIPEE-F) 2024, INEGI, comunicado 414/24, 18 de julho de 2024"
