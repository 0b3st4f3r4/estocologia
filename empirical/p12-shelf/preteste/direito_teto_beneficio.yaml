itens_descartados:
  - enunciado: "No ano-base 2022, o número de acidentes de trabalho fatais na Alemanha era maior que 400?"
    motivo: "Número conferido na fonte (397 em 2022), mas a margem é de 0,75% (3 casos em 400); sem folga, o item saiu e foi substituído por T10, com limiar de 350."
  - enunciado: "No ano-base 2022, o número de acidentes de trabalho não fatais com pelo menos 4 dias de afastamento na Espanha era maior que 500.000?"
    motivo: "Número conferido (497.832 em 2022, margem de 0,43%); abaixo da folga mínima do pool, o item saiu."
  - enunciado: "No ano-base 2024, o número de acidentes de trabalho fatais na Itália era maior que 500?"
    motivo: "Número conferido (482 em 2024 e 473 em 2022, margem de 3,6%); abaixo da folga mínima adotada nos itens do pool."
  - enunciado: "No ano-base 2022, o número de acidentes de trabalho fatais na Áustria era maior que 100?"
    motivo: "Número conferido (109 em 2022, margem de 9,0%); abaixo da folga de 10% usada para aceitar os demais itens."
  - enunciado: "No ano-base 2024, o número de acidentes de trabalho fatais na Polônia era maior que 200?"
    motivo: "Número conferido (250 em 2024 contra 168 em 2023 e 180 em 2022), mas o salto de 49% em um ano no mesmo indicador, sem nota de revisão na fonte, indica quebra de série; descartado pela regra 4."
  - enunciado: "No ano-base 2019, o número de acidentes de trabalho fatais na Romênia era maior que 200?"
    motivo: "Número conferido (227 em 2019), mas o mesmo indicador publica 127 em 2022 e 146 em 2023: cai à metade sem nota metodológica, o que indica quebra de série; descartado pela regra 4."
  - enunciado: "No ano-base 2022, o número de acidentes de trabalho não fatais com pelo menos 4 dias de afastamento na Dinamarca era maior que 100.000?"
    motivo: "Número conferido (110.668 em 2022 contra 50.179 em 2019 e 50.246 em 2023): oscilação de mais do dobro em um ano, sem explicação publicada; descartado pela regra 4."
  - enunciado: "No ano-base 2022, o número de acidentes de trabalho fatais na Grécia era maior que 50?"
    motivo: "O Eurostat não devolve valor para a Grécia em nenhum ano de 2019 a 2024 no indicador conferido (resposta vazia em todas as consultas); sem número publicado na fonte, o item não entra pela regra 4, e o pool não cria item «nao» por ausência de dado."
  - enunciado: "No ano-base 2024, o número de casos de afastamento do trabalho (dias fora) na indústria privada dos Estados Unidos era maior que 900.000?"
    motivo: "O BLS passou a publicar as características dos casos em base bienal: o comunicado 2023-2024 traz 1,8 milhão de casos no biênio e taxa anualizada de 86,6 por 10.000 trabalhadores, sem contagem anual simples comparável; a unidade do ano-base fica ambígua (regra 1)."
  - enunciado: "No ano-base 2023, o número de acidentes de trabalho liquidados no Brasil era maior que 400.000?"
    motivo: "As tabelas do Anuário Estatístico de Acidentes do Trabalho respondem 200 em gov.br, mas a autoridade (Ministério da Previdência Social) não consta da lista de fontes exigida pelo pool; a frente brasileira ficou com o IBGE (T26 e T27) e com o Banco Mundial (T28)."
  - enunciado: "No ano-base 2022, a taxa de reincidência de afastamento por acidente de trabalho no Brasil era maior que 10%?"
    motivo: "Não há número publicado em fonte da lista, dentro da janela 2015-2024, para reincidência de afastamento; sem número conferido na fonte, o tema saiu do pool (regra 3)."
  - enunciado: "No ano-base 2022, o número de acidentes fatais de trajeto (no deslocamento casa-trabalho) na União Europeia era maior que 300?"
    motivo: "A estatística europeia de acidentes de trabalho (ESAW) exclui explicitamente os acidentes de trânsito na estrada e a bordo de meio de transporte em serviço, e o Eurostat não publica essa fatia no conjunto conferido; a definição do indicador fica ambígua (regra 1)."
  - enunciado: "No ano-base 2023, o número de lesões no trabalho no Canadá era maior que 300.000?"
    motivo: "A API de tabelas do Statistics Canada (tabela 13-10-0079-01) respondeu 403 às requisições e nenhum número foi lido na fonte; o item saiu pela regra 4."
  - enunciado: "No ano-base 2022, a taxa de lesões ocupacionais fatais no mundo era maior que 10 por 100.000 trabalhadores?"
    motivo: "Os arquivos de download em massa da ILOSTAT (INJ_FATL_RSK_SEX_ECO_NB_A e SDG_0831_SEX_ECO_RT_A) responderam 404, o host rplumber.ilo.org não completou a conexão e o dataflow SDMX consultado respondeu 404; sem número lido na fonte, o item saiu."
  - enunciado: "No ano-base 2023, o valor médio do benefício por acidente de trabalho pago pelo programa federal FECA era maior que US$ 40.000?"
    motivo: "A página de estatísticas do programa (Departamento do Trabalho dos Estados Unidos, OWCP/DFEC) respondeu 200 trazendo só ligações, o PDF do «Annual Statistical Supplement 2024» da SSA respondeu 404 e a página de índice do mesmo volume, lida com 200, não publica o valor médio por acidente; sem número lido na fonte, os itens de valor e de custo do programa federal saíram, e a frente de valores de benefício ficou com o Monthly Statistical Snapshot da SSA (T25)."
  - enunciado: "Itens sobre a elasticidade da duração do afastamento em relação ao benefício semanal, sobre o teto do benefício e as mudanças de regra do Kentucky (1980) e do Michigan (1982), e sobre as bases wooldridge_injury, Toronto, Rhode Island, Kochel e LaLonde/NSW"
    motivo: "Proibidos pela regra 6 do enunciado do pool: são o próprio domínio elicitado (h2g/direito_teto_beneficio) e a resposta estaria no repositório do projeto e no livro."
