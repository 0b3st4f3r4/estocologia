itens_descartados:
  - enunciado: "No ano-base 2019, havia mais de 5 milhões de crianças fora da escola no nível primário na Índia (Banco Mundial, SE.PRM.UNER)?"
    motivo: "Número conferido na API do Banco Mundial, mas a série oscila de forma implausível: 8.894.878 em 2019, 4.873.048 em 2020, 2.758.325 em 2021 e 180.672 em 2022. Com dois números publicados discordando sobre a ordem de grandeza da resposta, o item sai pela regra 4."
  - enunciado: "No ano-base 2019, a taxa de alfabetização dos adultos da África do Sul era maior que 92%?"
    motivo: "Número conferido (SE.ADT.LITR.ZS: 95,02% em 2019), mas a série publica 90,0% em 2021 e 91,15% em 2024, sem continuidade; a resposta muda com a revisão e o item sai pelas regras 4 e 8."
  - enunciado: "No ano-base 2015, o gasto público em educação da Indonésia era maior que 3% do PIB?"
    motivo: "Há quebra de série no próprio indicador SE.XPD.TOTL.GD.ZS: 3,5836% em 2015 e 1,2102% em 2016, patamar que se mantém depois (0,86% em 2022). Com definição instável, o ano-base deixa de ser comparável e o item sai pela regra 1."
  - enunciado: "No ano-base 2019, o gasto público em educação da Noruega era maior que 8% do PIB?"
    motivo: "Conferido e falso (7,8646%), mas com margem de apenas 0,14 ponto percentual; a regra do pool pede margem conferida, e essa margem é frágil, então o item foi substituído pela versão com limiar de 7% (E03)."
  - enunciado: "No ano-base 2018, a pontuação média de leitura do PISA na Espanha era maior que 480?"
    motivo: "A tabela 602.50 do Digest of Education Statistics 2022 traz a Espanha como \"---\" (não disponível) na escala de leitura de 2018; sem número publicado na fonte conferida, o item não entra pela regra 4."
  - enunciado: "No ano-base 2019, a pontuação média de matemática do TIMSS na Coreia do Sul era maior que 600?"
    motivo: "A página de resultados do TIMSS do NCES (nces.ed.gov/timss/results19) é servida por script e não publica a tabela de pontuações por país em HTML, e o Digest 2022 não tem tabela do TIMSS (as tabelas 602.20 e 602.30 devolvem 404). Sem o número lido na fonte, o item não entra."
  - enunciado: "No ano-base 2018, a pontuação média de matemática do PISA na Alemanha era maior que 500?"
    motivo: "O relatório PISA 2022 da OCDE (oecd.org) respondeu 403 (desafio Cloudflare) e o Digest 2022 só publica leitura do PISA 2018 (602.50) e leitura/matemática quebradas por acesso a computador e internet em casa (602.45), o que não dá o escore nacional geral. Sem número conferido, o item sai."
  - enunciado: "No ano-base 2015-2017, a pontuação média de letramento dos adultos do Canadá era maior que 270?"
    motivo: "A tabela 604.10 do Digest 2022 (PIAAC) agrega as rodadas de \"2012 through 2017\", sem um ano-base único dentro da janela 2015-2024; o item sai pela regra 2."
  - enunciado: "Itens sobre proporção alunos/professor e tamanho de turma nas escolas públicas dos Estados Unidos (indicador cls do Condition of Education)"
