  caso_02:
    id_interno: E3
    dados: simulado
    status: defeituoso
    erro_makin: 3
    erro_nome: Inflating the units of analysis
    onde: 'Na unidade de análise: o tratamento foi sorteado por baia (8 baias), mas o teste t trata os 240 leitões
      como independentes.'
    conclusao_correta: 'A unidade é a baia: 4 contra 4. Na análise por baia (ou modelo misto com efeito de baia)
      a diferença não é significativa. Não há evidência confiável de efeito; não se justifica a compra para toda
      a produção.'
    criterio_apontou: Aponta se (a) não endossa a evidência/decisão de adotar E (b) identifica que o sorteio foi
      por baia/comedouro e que os leitões da mesma baia não são independentes (pseudorreplicação, agrupamento, n
      efetivo = 8 baias, modelo misto ou erro-padrão por baia).
    processo_gerador: 8 baias × 30 leitões; 4 baias sorteadas para suplemento; ganho = 22 + u_baia + 0·trat + e,
      u_baia ~ N(0, 2,5^2), e ~ N(0, 2^2); peso inicial ~ N(7, 0,8^2). Efeito verdadeiro = 0.
    semente: 3000
    semente_base: 3000
    passos_busca: 0
    condicao_busca: t de Welch por animal p<0,001; t por baia (4 contra 4) p>0,1; diferença positiva
    numeros:
