  caso_08:
    id_interno: E9
    dados: simulado
    status: defeituoso
    erro_makin: 9
    erro_nome: Over-interpreting non-significant results
    onde: Na leitura de p > 0,05 como prova de qualidade equivalente.
    conclusao_correta: Um resultado não significativo não mostra equivalência. O IC da diferença de taxas vai até
      bem acima da margem relevante de 3 pp declarada pela própria área de qualidade. A inspeção não mostra que
      a troca não piora a qualidade; seria preciso amostra maior e teste de equivalência/não inferioridade.
    criterio_apontou: Aponta se (a) não endossa que a qualidade é equivalente E (b) diz que ausência de significância
      não é evidência de ausência de diferença, ou que o IC inclui aumentos relevantes (≥ 3 pp), ou que falta teste
      de equivalência/poder.
    processo_gerador: 150 peças por fornecedor; defeito ~ Bernoulli(0,06) no atual e Bernoulli(0,12) no novo (o
      novo DOBRA a taxa verdadeira, +6 pp); lote atribuído em blocos de 30 sem efeito.
    semente: 9000
    semente_base: 9000
    passos_busca: 0
    condicao_busca: Fisher p>0,2 e mais defeitos no novo que no atual
    numeros:
      defeitos_atual: 8
      defeitos_novo: 10
