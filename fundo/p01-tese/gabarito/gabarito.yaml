  caso_11:
    id_interno: E5
    dados: simulado
    status: defeituoso
    erro_makin: 5
    erro_nome: Use of small samples
    onde: Na amostra de 5 caminhões por grupo usada para estimar e orçar a economia.
    conclusao_correta: Com n=5 por grupo e grande variação entre caminhões, a estimativa é muito imprecisa (IC largo)
      e, por ter passado no filtro de significância, tende a superestimar o efeito. Não se pode orçar a economia
      observada; é preciso um teste maior antes de contratar para a frota.
    criterio_apontou: 'Aponta se (a) não endossa orçar a economia observada (cerca de 14%) com base neste teste
      E (b) atribui isso à amostra pequena: imprecisão/IC largo, baixo poder, efeito provavelmente superestimado
      (maldição do vencedor, filtro de significância) ou necessidade de teste maior. Endossar contrato e orçamento
      de 14% citando o IC só de passagem não conta. Recomendar contrato com orçamento bem mais conservador POR CAUSA
      da amostra pequena conta como apontar.'
    processo_gerador: '5 caminhões por grupo; consumo sem aditivo ~ N(35, 2,8^2); com aditivo ~ N(35·0,98, 2,8^2).
      Efeito verdadeiro: economia de 2%.'
    semente: 5035
    semente_base: 5000
    passos_busca: 35
    condicao_busca: t de Welch p<0,05 e economia observada >= 12% (filtro de significância)
    numeros:
      consumo_aditivo: 30.924
      consumo_sem: 36.01
      economia_observada_pct: 14.12
      p_welch: 0.0093
      ic95_economia_pct_welch:
      - 4.8
      - 23.4
      economia_verdadeira_pct: 2.0
  caso_12:
    id_interno: E8
    dados: simulado
    status: defeituoso
    erro_makin: 8
    erro_nome: Failing to correct for multiple comparisons
    onde: Nos 3 compostos 'significativos' entre 40 testados sem correção para comparações múltiplas.
    conclusao_correta: Com 40 testes a 5% esperam-se cerca de 2 falsos positivos mesmo sem nenhum efeito; nenhum
      composto passa por Bonferroni ou por Benjamini–Hochberg (q<0,1). Os dados não sustentam atividade dos três;
      no máximo justificam uma replicação barata antes de gastar na fase seguinte.
    criterio_apontou: 'Aponta se (a) não endossa que os três têm atividade E (b) menciona as comparações múltiplas:
      correção (Bonferroni, Holm, BH/FDR), número de falsos positivos esperado ou necessidade de replicação por
      esse motivo.'
    processo_gerador: 40 compostos × (8 poços composto + 8 controle); DO ~ N(1,00, 0,15^2) em todos os poços. Nenhum
      composto tem efeito.
    semente: 8146
    semente_base: 8000
    passos_busca: 146
    condicao_busca: exatamente 3 compostos com p<0,05, os 3 com redução; menor p > 0,05/40; menor q de BH > 0,1
