    status: defeituoso
    erro_makin: 10
    erro_nome: Correlation and causation
    onde: Na leitura causal da diferença de renda entre participantes e uma amostra nacional que não é grupo de
      comparação válido.
    conclusao_correta: 'Os grupos diferem muito antes do programa (renda em 1974 e 1975, escolaridade, raça, estado
      civil): a diferença em 1978 reflete quem entrou no programa, não o efeito dele. Os dados não sustentam que
      o programa reduziu a renda; o experimento original (controles sorteados) mostra efeito positivo.'
    criterio_apontou: 'Aponta se (a) não endossa que o programa reduziu a renda E (b) diz que a comparação é confundida/enviesada
      por seleção, que a amostra nacional não é grupo controle comparável (ex.: renda antes do programa muito diferente)
      ou que associação não é causa. Classificar como ''falta de controle adequado'' (erro 1 de Makin) também conta.'
    fonte: 'Dados reais: tratados da amostra Dehejia–Wahba do NSW (LaLonde 1986; Dehejia & Wahba 1999) contra os
      controles observacionais CPS; arquivos nsw_experimental.csv e cps_observational.csv (Rdatasets causaldata::nsw_mixtape
      e cps_mixtape).'
    resposta_conhecida: 'No experimento (controles sorteados do próprio NSW), o efeito em renda_1978 é positivo:
      US$ 1794 (Welch p = 0.0079), calculado de nsw_experimental.csv. LaLonde (1986) mostrou que comparações com
      o CPS dão estimativas muito diferentes e negativas; Dehejia & Wahba (1999) recuperaram um valor próximo do
      experimental com pareamento por escore de propensão.'
