nome: biologia_sachs
area: Biologia (sinalização celular)
titulo: Mek → Erk em células T humanas sob 12 condições de reagente (Sachs et al. 2005)
pergunta: >-
  A fosforilação de Erk (p44/42) é governada pela de Mek com a mesma lei em todas as condições de reagente que não
  tocam o mecanismo Mek→Erk, de modo que inibir Mek seja uma alavanca previsível sobre Erk numa condição nova?
alegacao: '"Erk responde a Mek do mesmo jeito em qualquer estímulo: basta medir pmek para prever pErk numa condição nova."'
glossario:
  citometria_de_fluxo: medição célula a célula da intensidade de anticorpos fosfo-específicos (11 sinais por célula)
  fosforilacao: ativação de uma proteína pela adição de fosfato; aqui medida por anticorpo, em unidades arbitrárias
  condicao: combinação de estímulo geral (CD3/CD28, ± ICAM2) e reagente que ativa ou inibe um nó da rede
  inibidor: reagente que bloqueia a atividade de uma quinase (Akt-inib, G06976 → PKC, psitectorigenina → PIP2, LY294002 → PI3K, U0126 → MEK)
  ativador: reagente que liga um nó diretamente (PMA → PKC, β2cAMP → PKA)
  alvo_de_intervencao: nó da rede que o reagente atinge por desenho; o ambiente do ICP precisa agir em X, não em Y
  intervencao_oculta: reagente que muda a atividade sem mudar a fosforilação medida (U0126 inibe MEK mas pmek pode até subir)
  cascata_MAPK: Raf → Mek → Erk, o eixo clássico de proliferação
  escala_log: logaritmo das intensidades, que são positivas e muito assimétricas
  rede_consenso: grafo da literatura de vias que Sachs et al. usaram como referência
fontes:
  - "Sachs, Perez, Pe'er, Lauffenburger & Nolan (2005), Causal protein-signaling networks derived from multiparameter single-cell data, Science 308:523 — citada de memória, conferir"
  - "Meinshausen, Hauser, Mooij, Peters, Versteeg & Bühlmann (2016), Methods for causal inference from gene perturbation experiments and validation, PNAS 113:7361 — citada de memória, conferir"
  - "Peters, Bühlmann & Meinshausen (2016), Causal inference by using invariant prediction, JRSS-B 78:947 — citada de memória, conferir"
  - dados-reais/h2b/sachs2005/*.csv (14 arquivos do material suplementar; ver FONTES.md)
