ambientes:
  descricao: >-
    Condição de reagente (o arquivo de origem). Entram as 12 condições cujo alvo NÃO é o mecanismo Mek→Erk:
    estímulo geral (1, 2), inibidor de Akt (3, 10), G06976/PKC (4, 11), psitectorigenina/PIP2 (5, 12),
    LY294002/PI3K (7, 14), PMA/PKC (8) e β2cAMP/PKA (9). Ficam de fora, por decisão anterior a qualquer ajuste,
    as condições 6 e 13 (U0126): o U0126 inibe a atividade de MEK sem baixar o pmek medido, isto é, intervém na
    lei de Erk dado pmek (age em Y), o que viola a premissa do ICP. O cofre é a condição 14 (CD3/CD28 + ICAM2 +
    LY294002), nunca vista; a gêmea sem ICAM2 (7) está no treino. Violação plausível declarada: o β2cAMP (9) ativa
    PKA, pai de Erk; se o sinal "PKA" medido não acompanhar a atividade, a intervenção fica oculta e age em Y.
  cofre: [14_cd3cd28icam2_ly]
unidade: >-
  H2d (K = 3): a célula, como nas análises clássicas de ICP destes dados; as intervenções são por condição e as
  células são as réplicas. Ressalva: as ~850 células de uma condição dividem tubo, coloração e corrida no
  citômetro (efeito de desenho por condição 67 no H2b), então EP, F3 e posterior ficam otimistas
cabecalho:
  processo_gerador: Células T estimuladas e tratadas com um reagente por condição; cada célula tem 11 fosfossinais medidos por citometria; a fosforilação flui pela rede de vias (Raf→Mek→Erk, PKC e PKA a montante).
  nao_linearidade: Linear em log-log (lei de potência local); a resposta de Erk a Mek satura em intensidades altas, o que o ICP com n grande pode detectar como não invariância.
  unidade_e_margem: "H2d (K = 3): a célula é a unidade (≈ 9 200 no treino); erro padrão agrupado por célula (≈ robusto). Até o H2c a unidade era a condição (11 no treino, efeito de desenho 67)."
  fisica_do_ruido: Ruído de anticorpo e de citômetro multiplicativo, aproximadamente gaussiano em log; caudas de células mortas ou duplas.
  escada_causal: "Degrau 2 (intervenções por reagente com alvo conhecido). Premissas não testáveis: os reagentes só atingem o alvo declarado (efeitos fora do alvo existem) e a rede consenso é acíclica."
shelf:
  quantidade: elasticidade de pErk em relação a pMek (coeficiente log-log, ajustado por PKA e PKC)
  fonte: >-
    sem estimativa quantitativa publicada que eu conheça; ancorada na cascata MAPK (Mek é o único ativador de Erk,
    resposta ultrassensível ou amortecida conforme a célula) e nos gráficos de dispersão de Sachs et al. (2005),
    citados de memória, conferir; nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: 0.0, q25: 0.3, q50: 0.5, q75: 0.7, q95: 1.0}
decisao:
  acao: usar a inibição de Mek como alavanca para baixar Erk numa condição de estímulo nova
  beneficio_por_unidade: 1.0
  custo: 0.4
  custo_pesquisa: 0.02
  nota: >-
    utilidade em log-Erk evitado por unidade de log-Mek inibido; a alavanca compensa se a elasticidade passar de
    0,4 (efeitos fora do alvo do inibidor). Custo e limiar são suposições, não medidas
termo_escopo:
  vale_para: células T humanas primárias sob CD3/CD28 (± ICAM2) e os reagentes listados, na escala log das intensidades
  nao_vale_para: inibição direta de MEK por U0126 (excluída), outros tipos celulares, tempos de estímulo diferentes, níveis absolutos de proteína
tentativas_de_especificacao: 3
historico_especificacoes:
  - K: 1
    quando: H2b (2026-10-14)
    o_que: especificação original; ICP com o teste linear gaussiano (F aninhado + Levene, Bonferroni)
  - K: 2
    quando: H2c (2026-10-14, declarado antes de rodar em ../h2b/DECLARACAO_K2.md)
    o_que: >-
      só o teste de invariância do ICP muda, igual nos 5 domínios: um ajuste agrupado (X discreto como fator,
      contínuo linear + spline restrita de 4 nós), resíduo padronizado por escala agrupada, Kruskal–Wallis +
      Brown–Forsythe entre ambientes, Bonferroni; Y, X, ambientes, cofre, DAG, ajuste, priori e decisão iguais
    por_que: >-
      o teste K = 1 rejeita com n grande qualquer desvio do modelo linear gaussiano (X discreto com resposta
      não linear, cauda pesada, variância que depende de X), mesmo com a lei de Y dado X invariante
  - K: 3
    quando: H2d (2026-10-14, declarado antes de rodar em ../DECLARACAO_K3.md)
    o_que: >-
      regra de saturação no ICP, igual nos 5 domínios: um S cujo ambiente é função determinística das colunas de S
      (acerto 1-NN deixando a linha de fora ≥ 0,99) sai da família (nem aceito nem rejeitado); Ŝ é a interseção dos
      aceitos não saturados. Teste K = 2 e todo o resto iguais
    por_que: >-
      com X_S que determina o ambiente, Y ⊥ E | X_S vale por construção e o teste tem poder zero; um teste sem
      poder não certifica invariância (o Ŝ do RAND no K = 2 vinha só disso)
  - K: 3
    quando: H2d (2026-10-14, mesma declaração)
    o_que: >-
      a unidade passa a ser a célula, não a condição (F2 e F3 mudam; o Sachs passa a chegar ao F4); Y, candidatos,
      ambientes, cofre, DAG, ajuste, priori e decisão iguais
    por_que: >-
      as intervenções são por condição e as células são as réplicas, como nas análises clássicas de ICP destes dados
      (Meinshausen et al. 2016, PNAS — citada de memória, conferir); mudança feita depois da poda no F3 do H2b e
      declarada como tal; o efeito de desenho por condição (67 no H2b) é relatado como ressalva
