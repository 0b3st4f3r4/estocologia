nome: fisica_tunel_luz
area: Física (óptica e eletrônica)
titulo: Corrente da fonte de luz sob intervenções nos LEDs, polarizadores e sensores (Causal Chambers, túnel de luz)
pergunta: >-
  A corrente que a fonte de luz consome é governada pelo brilho dos LEDs com a mesma lei em todos os experimentos
  que não tocam o sensor de corrente, de modo que o efeito do vermelho aprendido até 170 preveja a corrente com o
  vermelho entre 171 e 255?
alegacao: '"A corrente segue os LEDs do mesmo jeito em qualquer experimento: basta saber o brilho para prever a corrente."'
glossario:
  tunel_de_luz: câmara com uma fonte de LEDs RGB, dois polarizadores lineares e três pares de sensores de luz ao longo do caminho
  brilho_led: comando PWM de cada LED (red, green, blue), 0 a 255
  corrente: corrente elétrica consumida pela fonte, medida por um sensor próprio (unidades do conversor)
  polarizador: filtro que deixa passar a luz polarizada num ângulo; a intensidade depois de dois segue a lei de Malus
  sensor_ir_vis: fotodiodos de infravermelho e visível nas posições 1, 2 e 3 do túnel
  fonte_l_ij: LEDs auxiliares perto dos sensores, que somam luz só no sensor vizinho
  parametro_de_sensor: tempo de exposição (t_*), diodo (diode_*), sobreamostragem (osr_*) e tensão de referência (v_*)
  experimento: um bloco de 1 000 (ou 10 000) medições em que um alvo é posto numa faixa nova e o resto é sorteado como na referência
  referencia: experimento sem intervenção, com os atuadores sorteados uniformemente nas faixas-base
  grafo_de_referencia: grafo causal publicado pelos autores, de atuadores e parâmetros para sensores
fontes:
  - "Gamella, Peters & Bühlmann (2025), Causal chambers as a real-world physical testbed for AI methodology, Nature Machine Intelligence — citada de memória, conferir; arXiv 2404.11341"
  - dados-reais/h2e/causal_chamber_lt_interventions_standard_v1.csv (ver FONTES.md)
arquivos: [causal_chamber_lt_interventions_standard_v1.csv]
familia: gaussiana
desfecho: corrente da fonte, padronizada pela média e pelo dp da referência
chave: red
candidatos:
  red: {tipo: num, descricao: brilho do LED vermelho / 255}
  green: {tipo: num, descricao: brilho do LED verde (0–255)}
  blue: {tipo: num, descricao: brilho do LED azul (0–255)}
  pol_1: {tipo: num, descricao: ângulo do polarizador 1 (graus)}
  pol_2: {tipo: num, descricao: ângulo do polarizador 2 (graus)}
  ir_1: {tipo: num, descricao: infravermelho no sensor 1}
  vis_1: {tipo: num, descricao: visível no sensor 1}
  ir_2: {tipo: num, descricao: infravermelho no sensor 2}
  vis_2: {tipo: num, descricao: visível no sensor 2}
  ir_3: {tipo: num, descricao: infravermelho no sensor 3}
icp_candidatos: [red, green, blue, pol_1, pol_2, ir_1, vis_1, ir_2, vis_2, ir_3]
ajuste: [green, blue]
dag:
  - [sorteio, red]
  - [red, y]
  - [green, y]
  - [blue, y]
  - [red, ir_1]
  - [green, ir_1]
  - [blue, ir_1]
  - [red, vis_1]
  - [green, vis_1]
  - [blue, vis_1]
  - [red, ir_2]
  - [green, ir_2]
  - [blue, ir_2]
  - [red, vis_2]
  - [green, vis_2]
  - [blue, vis_2]
  - [red, ir_3]
  - [green, ir_3]
  - [blue, ir_3]
