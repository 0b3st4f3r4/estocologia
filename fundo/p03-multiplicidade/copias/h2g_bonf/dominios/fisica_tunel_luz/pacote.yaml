  - [pol_2, ir_3]
ambientes:
  descricao: >-
    O experimento. Entram a referência e as intervenções sobre X (LEDs e polarizadores nas faixas mid e strong,
    fontes l_ij, parâmetros dos sensores de luz e de ângulo). Ficam fora os experimentos uniform_osr_c_* e
    uniform_v_c_*, que mexem no sensor de Y (agem em Y). O cofre é uniform_red_strong (vermelho 171–255, nunca
    visto); uniform_red_mid está no treino. Declarado em ../../DECLARACAO_H2e.md.
  cofre: [uniform_red_strong]
unidade: a medição; os atuadores são sorteados independentemente a cada medição
cabecalho:
  processo_gerador: A cada medição, o controlador sorteia os atuadores nas faixas do experimento e lê todos os sensores; a fonte consome corrente conforme o brilho dos três LEDs.
  nao_linearidade: Corrente aproximadamente aditiva e linear no PWM de cada LED; os sensores de luz dependem dos polarizadores pela lei de Malus (multiplicativa).
  unidade_e_margem: A medição é a unidade; 1 000 medições por experimento (10 000 na referência).
  fisica_do_ruido: Ruído eletrônico do conversor, aproximadamente gaussiano; quantização.
  escada_causal: "Degrau 2 (intervenções de alvo conhecido). Premissa não testável: o grafo de referência dos autores está completo."
shelf:
  quantidade: efeito de levar o vermelho de 0 a 255 na corrente, em dp de Y na referência
  fonte: >-
    argumento físico: corrente aditiva nos três LEDs, cada um sorteado em 0–85 na referência; com pesos iguais θ ≈ 6,
    se só o vermelho pesasse θ ≈ 10. Nenhum especialista humano consultado
  painel: argumento físico; nenhum especialista humano consultado
  quartis: {q05: 1.0, q25: 4.0, q50: 6.0, q75: 8.0, q95: 10.5}
decisao:
  acao: usar o brilho do vermelho como alavanca para regular a corrente da fonte
  beneficio_por_unidade: 1.0
  custo: 6.0
  custo_pesquisa: 0.05
  nota: decisão inventada (como no Sachs), com custo perto da mediana da priori; o F1 aqui não informa sobre o mundo
termo_escopo:
  vale_para: o túnel de luz na configuração padrão, com os parâmetros do sensor de corrente nos valores-base
  nao_vale_para: mudanças no sensor de corrente (osr_c, v_c), outra fonte de luz, outra câmara
tentativas_de_especificacao: 1
historico_especificacoes:
  - K: 1
    quando: H2e (2026-10-15, declarado antes de rodar em ../../DECLARACAO_H2e.md)
    o_que: especificação original; ICP com o teste K = 2 e a regra de saturação K = 3 do H2d, sem mudança
tem_titulares: false
