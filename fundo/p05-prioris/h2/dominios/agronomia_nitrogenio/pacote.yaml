nome: agronomia_nitrogenio
area: Agronomia
titulo: Resposta do milho ao nitrogênio em Las Rosas, Córdoba (1999 e 2001)
pergunta: Cada kg de nitrogênio a mais por hectare aumenta o rendimento do milho o bastante para pagar o adubo, e a resposta vale numa posição do relevo que o modelo não viu?
alegacao: '"Na Pampa argentina o milho responde ao nitrogênio em todo o lote: aplicar a dose cheia compensa em qualquer posição do relevo."'
glossario:
  monitor_de_colheita: sensor na colhedora que registra o rendimento georreferenciado a cada poucos metros
  faixa: tira longa do lote que recebeu uma única dose de nitrogênio, sorteada dentro do bloco
  bloco: repetição espacial (R1 a R3) que contém uma faixa de cada dose
  dose_de_nitrogenio: quilos de N por hectare aplicados (0 a ~130)
  quintal_por_hectare: 100 kg de grãos por hectare, unidade usual de rendimento na Argentina
  posicao_topografica: zona do relevo (W encosta oeste, HT topo, E encosta leste, LO baixada)
  brilho_do_solo: valor de brilho da imagem do solo nu, inversamente ligado à matéria orgânica
  manejo_sitio_especifico: aplicar doses diferentes de insumo em zonas diferentes do mesmo lote
  resposta_marginal: grãos adicionais por kg de N adicional
  razao_de_precos: preço do kg de N sobre o preço do kg de grão, que define a dose econômica
fontes:
  - Lambert, D. M., Lowenberg-DeBoer, J. & Bongiovanni, R. (2004). A comparison of four spatial regression models for yield monitor data - a case study from Argentina. Precision Agriculture 5, 579–600 (citado de memória, por conferir)
  - Anselin, L., Bongiovanni, R. & Lowenberg-DeBoer, J. (2004). A spatial econometric approach to the economics of site-specific nitrogen management in corn production. American Journal of Agricultural Economics 86(3), 675–687 (citado de memória, por conferir)
  - Wright, K., pacote agridat do R, base lasrosas.corn
  - dados-reais/h2/agridat_lasrosas.corn.csv (Rdatasets agridat::lasrosas.corn)
arquivos: [agridat_lasrosas.corn.csv]
familia: gaussiana
desfecho: rendimento de grãos de milho (quintais por hectare) no ponto do monitor de colheita
chave: nitrogenio
candidatos:
  nitrogenio: {tipo: num, descricao: dose de N sorteada na faixa (kg/ha)}
  nitrogenio_quad: {tipo: num, descricao: (dose − 65)²/100, curvatura da resposta}
  brilho_solo: {tipo: num, descricao: brilho do solo nu (bv)}
  ano_2001: {tipo: num, descricao: safra 2001 (1) ou 1999 (0)}
icp_candidatos: [nitrogenio, nitrogenio_quad, brilho_solo, ano_2001]
ajuste: [brilho_solo, ano_2001]
dag:
  - [nitrogenio, y]
  - [nitrogenio, nitrogenio_quad]
  - [nitrogenio_quad, y]
  - [brilho_solo, y]
  - [ano_2001, y]
  - [ano_2001, nitrogenio]
ambientes:
  descricao: >-
    posição topográfica (W, HT, E, LO); a baixada (LO) fica no cofre, nunca vista. Escolha feita antes de qualquer
    resultado. O ano foi descartado como ambiente: são só dois, e o clima do ano age direto no rendimento. O relevo
    muda fortemente a distribuição do brilho do solo (X), e a dose de N é sorteada, logo tem a mesma distribuição em
    toda zona; se a resposta a N e ao solo for uma lei agronômica estável, Y|X é invariante. Fraqueza declarada: o
    relevo também muda a água disponível, que não está na base e age direto em Y; espera-se que o ICP rejeite parte ou
    todos os conjuntos por isso. A baixada vai ao cofre por ser a extrapolação mais dura (mais água, mais matéria orgânica).
  cofre: [LO]
unidade: >-
  a faixa de nitrogênio (ano × bloco × dose; 36 faixas): é a unidade de sorteio da dose, e os pontos do monitor dentro
  de uma faixa são espacialmente autocorrelacionados. Cada faixa atravessa as quatro zonas do relevo
cabecalho:
  processo_gerador: Em cada safra e bloco, seis doses de N foram sorteadas entre faixas; a colhedora registrou o rendimento ponto a ponto.
  nao_linearidade: A resposta a N é côncava (platô); a chave entra linear (inclinação média na faixa de 0 a 130 kg) e a curvatura é candidata no ICP.
  unidade_e_margem: A faixa é a unidade; margem com erro padrão agrupado por faixa (36, das quais todas aparecem no treino).
  fisica_do_ruido: Ruído do sensor da colhedora mais variação espacial contínua do solo e da água; aproximadamente gaussiano, com caudas por falhas do monitor.
  escada_causal: Degrau 2 (dose sorteada entre faixas). Premissa não testável - a dose aplicada foi a sorteada e não há transbordamento entre faixas vizinhas.
shelf:
  quantidade: resposta marginal média do rendimento ao N (quintais/ha por kg N) entre 0 e ~130 kg N/ha
  fonte: >-
    literatura agronômica da Pampa argentina sobre eficiência agronômica do N em milho (tipicamente 5 a 20 kg de grão
    por kg de N na média da curva) e os trabalhos de Bongiovanni e Lowenberg-DeBoer; citada de memória, por conferir.
    Nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: 0.0, q25: 0.05, q50: 0.09, q75: 0.14, q95: 0.22}
decisao:
  acao: aplicar a dose cheia de nitrogênio (~125 kg/ha) em todo o lote, inclusive nas baixadas
  beneficio_por_unidade: 9.0
  custo: 0.45
  custo_pesquisa: 0.02
  nota: >-
    utilidade em US$ por hectare por kg de N aplicado; benefício = preço do grão (~US$ 9 por quintal) vezes θ; custo =
    preço do N (~US$ 0,45 por kg, ureia a ~US$ 210/t). Preços e custo de pesquisa são suposições da época, a conferir com
    o produtor
termo_escopo:
  vale_para: milho de sequeiro em Molissolos da Pampa argentina, doses de 0 a ~130 kg N/ha, safras parecidas com 1999 e 2001
  nao_vale_para: doses acima de 130 kg, outros cultivos, solos com outro regime hídrico, safras de seca extrema, outras fontes de N
tentativas_de_especificacao: 1
tem_titulares: false
