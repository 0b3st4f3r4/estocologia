nome: saude_rand
area: Saúde (seguro e uso de serviços)
titulo: Coparticipação sorteada e gasto médico no RAND Health Insurance Experiment (EUA, 1974–1982)
pergunta: >-
  Quanto o gasto médico anual cai por ponto de coparticipação, e a lei do gasto dada a coparticipação e as demais
  regras do plano vale num regime de coparticipação que não entrou no ajuste (50%)?
alegacao: '"Cobrar coparticipação corta o gasto médico na mesma proporção em qualquer nível de cobrança: o efeito de 25% e de 95% interpola o de 50%."'
glossario:
  coparticipacao: fração da conta paga pela família (0, 25, 50, 95 ou 100%) até o teto de desembolso
  plano: combinação sorteada de coparticipação, franquia individual e teto de desembolso (18 planos no arquivo)
  teto_de_desembolso: gasto máximo anual da família (MDE), em geral uma fração da renda
  franquia_individual: plano com franquia por pessoa só para atendimento ambulatorial (idp)
  pagamento_de_participacao: valor pago à família para compensar a pior perda possível no plano sorteado (lpi)
  sorteio_por_familia: famílias sorteadas entre planos dentro de cada local, pelo modelo de seleção finita
  pessoa_ano: uma linha por pessoa e ano de estudo (3 ou 5 anos)
  cuidado_gratuito: plano de coparticipação zero
  risco_moral: aumento do uso quando o preço marginal do atendimento cai
  local: uma das 6 cidades do estudo (Dayton, Seattle, Fitchburg, Franklin, Charleston, Georgetown)
fontes:
  - "Manning, Newhouse, Duan, Keeler, Leibowitz & Marquis (1987), Health insurance and the demand for medical care, American Economic Review 77:251 — citada de memória, conferir"
  - "Newhouse & the Insurance Experiment Group (1993), Free for All? Lessons from the RAND Health Insurance Experiment, Harvard University Press — citada de memória, conferir"
  - "Aron-Dine, Einav & Finkelstein (2013), The RAND Health Insurance Experiment, three decades later, JEP 27:197 — citada de memória, conferir"
  - dados-reais/h2b/sampleSelection_RandHIE.csv (Rdatasets sampleSelection::RandHIE)
arquivos: [sampleSelection_RandHIE.csv]
familia: gaussiana
desfecho: log(1 + gasto médico coberto no ano, dólares), por pessoa-ano
chave: coparticipacao
candidatos:
  coparticipacao: {tipo: num, descricao: taxa de coparticipação do plano sorteado, de 0 a 1}
  franquia_individual: {tipo: num, descricao: plano com franquia individual (idp)}
  pagamento_log: {tipo: num, descricao: log do pagamento anual de participação (lpi)}
  teto_log: {tipo: num, descricao: log do teto de desembolso quando há franquia individual (fmde)}
  renda_log: {tipo: num, descricao: log da renda familiar (linc)}
  idade: {tipo: num, descricao: idade em anos}
  mulher: {tipo: num, descricao: sexo feminino}
  doencas_cronicas: {tipo: num, descricao: número de doenças crônicas na linha de base (disea)}
  limitacao_fisica: {tipo: num, descricao: limitação física na linha de base (physlm)}
  local: {tipo: cat, descricao: cidade do estudo (site 1 a 6)}
icp_candidatos: [coparticipacao, franquia_individual, pagamento_log, teto_log, renda_log, idade, mulher, doencas_cronicas, limitacao_fisica, local]
ajuste: [franquia_individual, pagamento_log, teto_log, local, renda_log, idade, mulher, doencas_cronicas, limitacao_fisica]
dag:
  - [local, plano]
  - [plano, coparticipacao]
  - [plano, franquia_individual]
  - [plano, pagamento_log]
  - [plano, teto_log]
  - [renda_log, pagamento_log]
  - [renda_log, teto_log]
  - [coparticipacao, y]
  - [franquia_individual, y]
  - [pagamento_log, y]
  - [teto_log, y]
  - [local, y]
  - [renda_log, y]
  - [idade, doencas_cronicas]
  - [idade, limitacao_fisica]
  - [idade, y]
  - [mulher, y]
  - [doencas_cronicas, y]
  - [limitacao_fisica, y]
ambientes:
  descricao: >-
    Regime de coparticipação sorteado (c0, c25, c50, c95, c100). O sorteio do plano fixa a coparticipação (X) e
    demais regras do plano (franquia individual, teto, pagamento de participação), que também são candidatos; por
    desenho, o plano não muda o estado de saúde nem a renda de partida. O regime de 50% (planos 8, 9, 10) fica no
    cofre, nunca visto: é a interpolação que a alegação promete. Violações plausíveis declaradas: os planos de 100%
    (2 a 4) só existem em Dayton (local 1), por isso o local é candidato; o efeito do preço pode não ser linear na
    taxa (a literatura acha a maior queda entre 0 e 25%), e aí o regime age em Y além do que a reta em
    coparticipação capta; atrito diferencial por plano (mais saídas nos planos caros).
  cofre: [c50]
unidade: >-
  a pessoa (zper), com 3 a 5 anos de observação; o sorteio foi por família, mas o arquivo não traz identificador de
  família, então irmãos e cônjuges entram como unidades separadas (EP possivelmente otimista)
cabecalho:
  processo_gerador: Famílias sorteadas entre planos em 6 cidades; o plano fixa o preço marginal do atendimento (coparticipação) até um teto de desembolso; cada pessoa decide quanto usar no ano.
  nao_linearidade: Linear na taxa sobre log(1 + gasto); a resposta é côncava (queda maior de 0 a 25%) e há massa em zero (cerca de um quarto sem gasto), ambos fora do modelo.
  unidade_e_margem: A pessoa é a unidade (≈ 5 900 pessoas, 20 mil pessoas-ano); erro padrão agrupado por pessoa.
  fisica_do_ruido: Gasto com cauda pesadíssima (internações); log(1 + gasto) doma a cauda mas deixa bimodalidade entre zero e usuários.
  escada_causal: "Degrau 2 (plano sorteado). Premissas não testáveis: o atrito e a recusa diferencial por plano não distorcem a comparação; o pagamento de participação neutraliza o efeito renda."
shelf:
  quantidade: variação de log(1 + gasto médico anual) por unidade de taxa de coparticipação (0 → 100%)
  fonte: >-
    Manning et al. (1987) e Aron-Dine et al. (2013): gasto médio cerca de 30% menor no plano de 95% que no gratuito
    e probabilidade de algum uso de ~87% contra ~68%; combinados na escala log(1 + gasto) dão algo perto de −1 por
    unidade de taxa. Citados de memória, conferir; nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: -2.0, q25: -1.4, q50: -1.0, q75: -0.65, q95: -0.2}
decisao:
  acao: trocar o cuidado gratuito por coparticipação de 25%
  beneficio_por_unidade: -0.25
  custo: 0.2
  custo_pesquisa: 0.01
  nota: >-
    utilidade em log-gasto evitado: passar a 25% muda o log-gasto em 0,25·θ (θ negativo vira benefício, por isso
    −0,25); o custo de 0,2 representa o dano de saúde e bem-estar do uso evitado (suposição, não medida)
termo_escopo:
  vale_para: famílias não idosas dos EUA nos anos 1970, planos com teto de desembolso, gasto médico coberto (sem odontologia e psicoterapia)
  nao_vale_para: idosos (Medicare), planos sem teto de desembolso, sistemas de saúde de outros países, desfechos de saúde (só gasto)
tentativas_de_especificacao: 3
historico_especificacoes:
  - K: 1
    quando: H2b (2026-10-14)
    o_que: especificação original; ICP com o teste linear gaussiano (F aninhado + Levene, Bonferroni)
  - K: 2
    quando: H2c (2026-10-14, declarado antes de rodar em ../h2b/DECLARACAO_K2.md)
    o_que: >-
      só o teste de invariância do ICP muda, igual nos 5 domínios: um ajuste agrupado (X discreto como fator,
      contínuo linear + spline restrita de 4 nós), resíduo padronizado por escala agrupada, Kruskal–Wallis +
      Brown–Forsythe entre ambientes, Bonferroni; Y, X, ambientes, cofre, DAG, ajuste, priori e decisão iguais
    por_que: >-
      o teste K = 1 rejeita com n grande qualquer desvio do modelo linear gaussiano (X discreto com resposta
      não linear, cauda pesada, variância que depende de X), mesmo com a lei de Y dado X invariante
  - K: 3
    quando: H2d (2026-10-14, declarado antes de rodar em ../DECLARACAO_K3.md)
    o_que: >-
      regra de saturação no ICP, igual nos 5 domínios: um S cujo ambiente é função determinística das colunas de S
      (acerto 1-NN deixando a linha de fora ≥ 0,99) sai da família (nem aceito nem rejeitado); Ŝ é a interseção dos
      aceitos não saturados. Teste K = 2 e todo o resto iguais
    por_que: >-
      com X_S que determina o ambiente, Y ⊥ E | X_S vale por construção e o teste tem poder zero; um teste sem
      poder não certifica invariância (o Ŝ do RAND no K = 2 vinha só disso)
tem_titulares: true
quase_ids: [mulher, local]
