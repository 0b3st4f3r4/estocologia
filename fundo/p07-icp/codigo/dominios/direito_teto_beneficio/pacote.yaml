nome: direito_teto_beneficio
area: Direito (regra de indenização trabalhista)
titulo: Teto do benefício por acidente de trabalho e duração do afastamento (Kentucky 1980, Michigan 1982)
pergunta: >-
  Quanto um benefício semanal maior alonga o afastamento por acidente de trabalho, e a lei da duração dado o
  benefício e o salário vale no Michigan depois da mudança da regra, um regime que não entrou no ajuste?
alegacao: '"O afastamento cresce com o benefício pela mesma elasticidade em qualquer estado e regra: o que se aprendeu no Kentucky vale para a reforma do Michigan."'
glossario:
  indenizacao_trabalhista: seguro obrigatório que paga parte do salário durante o afastamento por acidente de trabalho
  beneficio_semanal: valor real pago por semana de afastamento, dois terços do salário até o teto
  teto_do_beneficio: valor máximo do benefício semanal, fixado em lei estadual
  mudanca_de_regra: aumento do teto (Kentucky em julho de 1980, Michigan em 1982) que só atinge quem ganha acima dele
  alta_renda: trabalhador cujo salário anterior passava do teto antigo (o grupo tratado)
  duracao: semanas de benefício pagas no afastamento
  elasticidade: variação percentual da duração por 1% a mais de benefício
  risco_moral: afastamento mais longo quando o custo de ficar fora do trabalho cai
  diferencas_em_diferencas: comparação de antes e depois entre o grupo atingido e o não atingido pela regra
  salario_anterior: salário semanal antes do acidente, em dólares de 1982
fontes:
  - "Meyer, Viscusi & Durbin (1995), Workers' compensation and injury duration: evidence from a natural experiment, American Economic Review 85:322 — citada de memória, conferir"
  - "Krueger (1990), Incentive effects of workers' compensation insurance, Journal of Public Economics 41:73 — citada de memória, conferir"
  - "Wooldridge, Introductory Econometrics, exemplo 13.4 (base injury) — citado de memória, conferir"
  - dados-reais/h2b/wooldridge_injury.csv (Rdatasets wooldridge::injury)
arquivos: [wooldridge_injury.csv]
familia: gaussiana
desfecho: log da duração do benefício em semanas (ldurat)
chave: beneficio_log
candidatos:
  beneficio_log: {tipo: num, descricao: log do benefício semanal real}
  salario_log: {tipo: num, descricao: log do salário semanal anterior (dólares de 1982)}
  alta_renda: {tipo: num, descricao: salário acima do teto antigo (highearn)}
  kentucky: {tipo: num, descricao: 1 se Kentucky, 0 se Michigan}
  homem: {tipo: num, descricao: sexo masculino}
  casado: {tipo: num, descricao: casado}
  idade_log: {tipo: num, descricao: log da idade no acidente}
  internacao: {tipo: num, descricao: o acidente exigiu internação}
  tipo_lesao: {tipo: cat, descricao: tipo de lesão (8 classes)}
  industria: {tipo: cat, descricao: indústria (3 classes)}
icp_candidatos: [beneficio_log, salario_log, alta_renda, kentucky, homem, casado, idade_log, internacao, tipo_lesao, industria]
ajuste: [salario_log, alta_renda, kentucky, homem, casado, idade_log, internacao, tipo_lesao, industria]
dag:
  - [periodo, teto]
  - [kentucky, teto]
  - [teto, beneficio_log]
  - [teto, alta_renda]
  - [salario_log, alta_renda]
  - [salario_log, beneficio_log]
  - [beneficio_log, y]
  - [salario_log, y]
  - [kentucky, y]
  - [homem, salario_log]
  - [idade_log, salario_log]
  - [industria, salario_log]
  - [industria, tipo_lesao]
  - [tipo_lesao, internacao]
  - [tipo_lesao, y]
