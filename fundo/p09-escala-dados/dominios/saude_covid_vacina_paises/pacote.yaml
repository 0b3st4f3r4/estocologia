nome: saude_covid_vacina_paises
area: Saúde (epidemiologia da COVID-19, 2021-2022)
titulo: Cobertura vacinal e mortes por COVID-19 no mês seguinte, painel país-mês 2021-2022 (Our World in Data)
pergunta: >-
  A fração da população com esquema vacinal completo prevê as mortes por COVID-19 do mês seguinte com a mesma lei
  em todos os continentes, dada a estrutura etária, a renda, os leitos e o mês do calendário, de modo que a lei
  ajustada em cinco continentes preveja a América do Sul, que não entrou no ajuste?
alegacao: '"Vacinar mais derruba as mortes por COVID do mês seguinte do mesmo jeito em qualquer continente: a curva de um continente prevê a do outro."'
glossario:
  esquema_completo: pessoas com todas as doses do esquema primário, por 100 habitantes (people_fully_vaccinated_per_hundred)
  mortes_por_milhao: mortes confirmadas por COVID-19 por milhão de habitantes, somadas no mês
  mes_seguinte: o desfecho é medido no mês m+1, a vacinação no fim do mês m, para respeitar a ordem no tempo
  casos_por_milhao: casos confirmados por milhão no mês m, um mediador (a vacina também muda os casos)
  indice_de_rigor: índice de rigor das medidas de contenção (Oxford, 0 a 100), média do mês
  idade_mediana: idade mediana da população (estrutural, constante no painel)
  idosos: fração da população com 65 anos ou mais
  subnotificacao: diferença entre mortes reais e mortes confirmadas, que varia por país e continente
  efetividade_vacinal: redução relativa do risco individual em vacinados; não é a inclinação ecológica
  falacia_ecologica: inferir efeito individual a partir de associação entre agregados (países)
fontes:
  - "Mathieu, Ritchie, Rodés-Guirao et al. (2020-2024), Coronavirus Pandemic (COVID-19), Our World in Data; arquivo owid-covid-data.csv do repositório github.com/owid/covid-19-data, commit dc00e7296b17ab5548092c9e388b6fac6751f095"
  - "Haas et al. (2021), Impact and effectiveness of mRNA BNT162b2 vaccine against SARS-CoV-2 infections and COVID-19 cases, hospitalisations, and deaths following a nationwide vaccination campaign in Israel, Lancet 397:1819 — efetividade contra morte 96,7% (IC95% 96,0-97,3), conferida em https://pmc.ncbi.nlm.nih.gov/articles/PMC8099312 (comentário de Leshem & Wilder-Smith 2021)"
arquivos: [owid-covid-data.csv]
familia: gaussiana
desfecho: log(1 + mortes por COVID-19 por milhão no mês seguinte), por país-mês
chave: vacinados
candidatos:
  vacinados: {tipo: num, descricao: fração com esquema completo no fim do mês (0 a 1)}
  casos_log: {tipo: num, descricao: log(1 + casos por milhão no mês)}
  rigor: {tipo: num, descricao: índice de rigor médio do mês}
  idade_mediana: {tipo: num, descricao: idade mediana da população}
  idosos: {tipo: num, descricao: porcentagem com 65 anos ou mais}
  pib_log: {tipo: num, descricao: log do PIB per capita (PPC)}
  leitos: {tipo: num, descricao: leitos hospitalares por mil habitantes}
  diabetes: {tipo: num, descricao: prevalência de diabetes em adultos (%)}
  mes: {tipo: cat, descricao: mês do calendário (2021-01 a 2022-12), proxy da variante dominante e da sazonalidade}
icp_candidatos: [vacinados, casos_log, rigor, idade_mediana, idosos, pib_log, leitos, diabetes, mes]
ajuste: [idade_mediana, idosos, pib_log, leitos, diabetes, mes]
dag:
  - [idade_mediana, vacinados]
  - [idade_mediana, y]
  - [idosos, vacinados]
  - [idosos, y]
  - [pib_log, vacinados]
  - [pib_log, leitos]
  - [pib_log, y]
  - [leitos, y]
  - [diabetes, y]
  - [mes, vacinados]
  - [mes, casos_log]
  - [mes, y]
  - [vacinados, casos_log]
  - [vacinados, rigor]
  - [vacinados, y]
  - [casos_log, y]
  - [rigor, casos_log]
ambientes:
  descricao: >-
    Continente (África, Ásia, Europa, América do Norte, Oceania, América do Sul), países com população de pelo
    menos 1 milhão. O cofre é a América do Sul (10 países), nunca vista. O continente muda a cobertura vacinal (o
    acesso às vacinas foi muito desigual) e a estrutura etária, isto é, age em X. Violações plausíveis declaradas:
    a subnotificação de mortes varia por continente (o ambiente age em Y); as variantes chegaram em meses
    diferentes; a inclinação é ecológica e não é a efetividade individual; há pai oculto (testagem, sistema de
    saúde) entre renda, vacinação e mortes registradas.
  cofre: [South_America]
unidade: >-
  o país (24 meses por país); o EP é agrupado por país, mas meses vizinhos do mesmo país e países vizinhos
  compartilham onda epidêmica, então ainda pode ser otimista
cabecalho:
  processo_gerador: Cada país vacina no ritmo que o acesso e a política permitem; ondas de variantes atravessam continentes em meses diferentes; as mortes registradas no mês seguinte dependem da imunidade, da idade, do sistema de saúde e da notificação.
  nao_linearidade: Linear na cobertura sobre log(1 + mortes); a proteção satura e depende do tempo desde a dose e da variante, fora do modelo.
  unidade_e_margem: O país é a unidade (cerca de 130 países, 3 167 países-mês no recorte; 2 927 no treino); EP agrupado por país.
  fisica_do_ruido: Mortes mensais com cauda pesada e zeros em países pequenos ou com pouca notificação; log(1 + x) doma a cauda.
  escada_causal: "Degrau 1 (observacional, ecológico). Premissas não testáveis: sem confusão por testagem e notificação; o mês capta a variante; a ordem no tempo (vacinação em m, mortes em m+1) basta para a direção."
shelf:
  quantidade: variação de log(1 + mortes por milhão no mês seguinte) por unidade de cobertura vacinal (0 → 100%)
  fonte: >-
    Efetividade individual contra morte de 96,7% em Israel (Haas et al. 2021, conferida em
    https://pmc.ncbi.nlm.nih.gov/articles/PMC8099312) daria até log(0,033) ≈ −3,4 se todos fossem vacinados e
    nada mais mudasse; a mediana fica em −1,5 porque a efetividade cai com Ômicron e com o tempo, e a confusão
    ecológica (países ricos e velhos vacinam mais e notificam mais mortes) puxa para cima; a cauda chega a +0,3.
    Nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: -3.5, q25: -2.3, q50: -1.5, q75: -0.8, q95: 0.3}
decisao:
  acao: acelerar a vacinação para +10 pontos de cobertura completa num mês
  beneficio_por_unidade: -0.1
  custo: 0.05
  custo_pesquisa: 0.005
  nota: >-
    utilidade em log-mortes evitadas: +0,1 de cobertura muda o log-mortes em 0,1·θ (θ negativo vira benefício, por
    isso −0,1); o custo de 0,05 representa o custo logístico e de compra da aceleração (suposição, não medida)
termo_escopo:
  vale_para: países com mais de 1 milhão de habitantes entre 2021 e 2022, mortes confirmadas (não excesso de mortalidade)
  nao_vale_para: efetividade individual, doses de reforço, 2023 em diante, países sem notificação regular
tentativas_de_especificacao: 1
historico_especificacoes:
  - K: 1
    quando: fundo/p09 (2026-10-15, declarado antes de rodar em DECLARACAO.md)
    o_que: especificação original; funil do H2g sem mudança (teste K = 2 e regra de saturação K = 3 do ICP)
tem_titulares: false
quase_ids: []
