ambientes:
  descricao: >-
    Centro do ensaio. Michigan (UM, 164 pacientes) e Indiana (IU, 413) ficam separados; Kentucky (22) e Case
    Western (3) entram juntos como "outros", por regra declarada antes de rodar. O cofre é Michigan, nunca visto:
    é o centro de origem do ensaio e recebe a maior fração de pacientes de alto risco encaminhados. O centro muda
    a mistura de pacientes e de procedimentos (X), e o sorteio garante que a indometacina não depende do centro.
    Violações plausíveis declaradas: a definição de pancreatite e o limiar de internação podem variar entre centros
    (o centro age em Y); o treino tem só dois ambientes, um deles com 25 pacientes, então o ICP tem pouco poder.
  cofre: [UM]
unidade: o paciente (uma linha por paciente; o sorteio é individual)
cabecalho:
  processo_gerador: Pacientes de alto risco submetidos a CPRE em 4 centros são sorteados para indometacina retal ou placebo logo após o procedimento; a pancreatite é avaliada nos dias seguintes.
  nao_linearidade: Logística no braço e nos fatores de risco; interações entre fatores (por exemplo stent e esfincterotomia) ficam fora.
  unidade_e_margem: O paciente é a unidade (602 no total, 438 no treino); o desfecho é raro (perto de 1 em 8 no protocolo do ensaio).
  fisica_do_ruido: Desfecho binário raro; poucas dezenas de eventos por ambiente limitam a resolução de qualquer previsão.
  escada_causal: "Degrau 2 (braço sorteado). Premissas não testáveis: cegamento mantido; perdas desprezíveis; a definição de pancreatite é a mesma nos centros."
shelf:
  quantidade: razão de chances da pancreatite pós-CPRE, indometacina contra placebo
  escala: razao_de_chances
  fonte: >-
    Meta-análise anterior ao ensaio (Elmunzer et al. 2008, Gut): redução de 64% (IC95% 0,22-0,60) com AINE retal
    em 4 ensaios pequenos; a priori encolhe a mediana para 0,5 pela tendência de efeitos grandes em ensaios
    pequenos e alarga a cauda até 1,15 (sem efeito). taxa_base 0,12: taxa no placebo suposta no cálculo amostral do
    ensaio (12,06%), conferida em https://pmc.ncbi.nlm.nih.gov/articles/PMC3422786. Nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: 0.20, q25: 0.36, q50: 0.50, q75: 0.70, q95: 1.15}
  taxa_base: 0.12
decisao:
  acao: dar indometacina retal 100 mg a todo paciente de alto risco depois da CPRE
  beneficio_por_unidade: -1.0
  custo: 0.002
  custo_pesquisa: 0.001
  nota: >-
    utilidade em casos de pancreatite evitados por paciente: θ é a variação aproximada da probabilidade
    (β·p̄(1−p̄)), negativa quando a droga protege, por isso −1; o custo de 0,002 caso-equivalente por paciente
    representa droga, aplicação e risco de sangramento (suposição, não medida)
termo_escopo:
  vale_para: pacientes de alto risco submetidos a CPRE em centros terciários dos EUA entre 2009 e 2011
  nao_vale_para: pacientes de baixo risco, outras doses ou vias, centros sem stent pancreático de rotina, desfechos além da pancreatite
tentativas_de_especificacao: 1
historico_especificacoes:
