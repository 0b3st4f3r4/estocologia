nome: saude_indometacina_ercp
area: Saúde (gastroenterologia, ensaio clínico)
titulo: Indometacina retal sorteada e pancreatite pós-CPRE em 4 centros dos EUA (Elmunzer et al. 2012)
pergunta: >-
  A indometacina retal dada logo após a CPRE reduz o risco de pancreatite pós-CPRE com a mesma lei em centros
  diferentes, de modo que o efeito estimado nos outros centros preveja o centro que não entrou no ajuste?
alegacao: '"Uma dose de indometacina retal corta a pancreatite pós-CPRE do mesmo jeito em qualquer hospital: o resultado de um centro vale para o outro."'
glossario:
  cpre: colangiopancreatografia retrógrada endoscópica, endoscopia das vias biliares e do ducto pancreático
  pancreatite_pos_cpre: inflamação aguda do pâncreas depois da CPRE, o desfecho (sim ou não)
  indometacina_retal: anti-inflamatório não esteroide, 100 mg por via retal logo após o procedimento
  placebo: supositório sem droga, sorteado no mesmo esquema
  sorteio: alocação aleatória do braço, estratificada por centro no ensaio original
  disfuncao_do_esfincter_de_oddi: alteração da motilidade do esfíncter, fator de risco conhecido (sod)
  esfincterotomia_pancreatica: corte do esfíncter pancreático durante o procedimento, fator de risco
  stent_pancreatico: prótese no ducto pancreático, posta a critério do endoscopista, possivelmente protetora
  escore_de_risco: soma de fatores de risco do protocolo (risk, 1 a 5,5)
  centro: hospital do ensaio (Michigan, Indiana, Kentucky, Case Western)
fontes:
  - "Elmunzer, Scheiman, Lehman et al. (2012), A randomized trial of rectal indomethacin to prevent post-ERCP pancreatitis, N Engl J Med 366:1414-1422 — números conferidos em https://pmc.ncbi.nlm.nih.gov/articles/PMC3422786 (Yang & Draganov 2012, World J Gastroenterol 18:4082)"
  - "Elmunzer, Waljee, Elta et al. (2008), A meta-analysis of rectal NSAIDs in the prevention of post-ERCP pancreatitis, Gut 57:1262-1267 — redução de 64% (IC95% 0,22-0,60) em 4 ensaios, conferida na mesma página"
  - "medicaldata::indo_rct (Higgins), espelho Rdatasets, raw.githubusercontent.com/vincentarelbundock/Rdatasets/master/csv/medicaldata/indo_rct.csv"
arquivos: [medicaldata_indo_rct.csv]
familia: binomial
desfecho: pancreatite pós-CPRE (1 = sim), por paciente
chave: indometacina
