ambientes:
  descricao: >-
    Sítio, cruzando sistema hospitalar e tipo de UTI: sistema pela pasta (A = training_setA, B = training_setB);
    tipo = MICU se Unit1 = 1, SICU se Unit2 = 1, e "outros" se nenhuma das duas (flag ausente ou 0), pelo
    primeiro valor não ausente da janela. Nível com menos de 200 linhas vira "outros" do seu sistema (regra
    mecânica). Treino = os três níveis do sistema A (Beth Israel Deaconess); cofre = os três níveis do sistema B
    (Emory). O tipo de UTI muda a mistura de pacientes e o protocolo local, e o sistema muda o prontuário, a
    porta de entrada e a prática — o próprio manuscrito do desafio mostra que o que se ajusta num sistema não
    vale automaticamente no outro. Violações plausíveis declaradas: o tipo de UTI não é sorteado; o rótulo
    depende de SOFA, que não está todo medido aqui (pai oculto); a FR e o rótulo compartilham a decisão de quem
    pede hemocultura (confusão por indicação).
  cofre: [B_MICU, B_SICU, B_outros]
unidade: >-
  a internação na UTI (uma linha por internação; linha e unidade coincidem, então não há agrupamento declarado
  e o EP do F2 não é agrupado)
cabecalho:
  processo_gerador: >-
    Cada internação entra na UTI de um dos dois sistemas hospitalares; na primeira janela de 6 h os monitores
    registram os sinais vitais; depois, quem suspeita de infecção registra hemocultura e antibiótico IV e o
    SOFA é calculado, o que marca a decisão de sepse que o rótulo mede.
  nao_linearidade: >-
    Logística no gatilho e nas covariáveis; o limiar de suspeita do clínico não é linear (qSOFA usa cortes), e a
    saturação de O2 e a temperatura têm efeito em U.
  unidade_e_margem: >-
    A internação é a unidade e a linha (dezenas de milhares, depois dos recortes); o desfecho é raro e a margem
    de quem tem 6 h de monitoração completa difere de quem não tem.
  fisica_do_ruido: >-
    Desfecho binário raro com dezenas de milhares de linhas; faltantes em bloco nas primeiras horas (o
    monitoramento começa quando o paciente chega) e nos exames de laboratório, que não entram aqui.
  escada_causal: >-
    "Degrau 1 (observacional). Premissas não testáveis: a suspeita de infecção é registrada de forma comparável
    nos dois sistemas; o SOFA não está todo medido; a FR não é manipulada pelo estudo."
shelf:
  quantidade: inclinação da decisão de sepse registrada na FR, em log-razão de chances por respiração por minuto
  escala: razao_de_chances
  fonte: >-
    O qSOFA (Seymour et al. 2016, JAMA, DOI 10.1001/jama.2016.0288, conferido no Europe PMC) adota o limiar de
    taquipneia ≥ 22/min entre os três critérios e reporta discriminação modesta para desfecho em UTI (AUROC 0,66
    para mortalidade intra-hospitalar na coorte de validação, IC95% 0,64-0,68); o critério é composto de três
    itens, então uma distância de 6 respirações por minuto no limiar vale uma razão de chances de cerca de 2, o
    que dá ~0,11 por minuto, atenuado pela severidade que já está medida no ajuste. Daí a mediana de 1,06 e a
    cauda até 1,45. taxa_base 0,05: a sepse é rara no conjunto público do desafio; 5% é ordem de grandeza
    declarada, sem conferir o dado. Nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: 0.84, q25: 0.96, q50: 1.06, q75: 1.18, q95: 1.45}
  taxa_base: 0.05
decisao:
  acao: usar a FR máxima da primeira janela (limiar 22/min) como gatilho do pacote de sepse (hemoculturas, antibiótico e lactato) em toda UTI
  beneficio_por_unidade: 1.0
  custo: 0.005
  custo_pesquisa: 0.0005
  nota: >-
    utilidade em casos-equivalentes por unidade de efeito marginal na probabilidade de a decisão ser registrada
    (θ = β·p̄(1−p̄)); o custo de 0,005 por paciente rastreado representa o pacote extra (hemoculturas, antibiótico,
    lactato) e o alarme falso (suposição, não medida); o custo da pesquisa de 0,0005 representa uma análise
    secundária de registro aberto, sem coleta nova
termo_escopo:
  vale_para: internações de UTI dos dois sistemas públicos do desafio (Beth Israel Deaconess e Emory), nas 6 primeiras horas registradas
  nao_vale_para: pronto-socorro, enfermaria, outros limiares de FR, sistemas sem hemocultura e antibiótico IV registrados no mesmo par de campos
tentativas_de_especificacao: 1
historico_especificacoes:
