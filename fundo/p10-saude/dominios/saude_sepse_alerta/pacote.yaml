nome: saude_sepse_alerta
area: Saúde (terapia intensiva, alerta precoce de sepse)
titulo: Alerta de sepse na primeira janela de 6 h em dois sistemas hospitalares dos EUA (PhysioNet/CinC 2019)
pergunta: >-
  A mesma lei liga a frequência respiratória da primeira janela de 6 h à decisão de sepse registrada em qualquer
  UTI e em qualquer sistema hospitalar, de modo que a lei ajustada nas UTIs de um sistema preveja o outro
  sistema, que não entrou no ajuste?
alegacao: '"Uma FR alta na primeira janela diz a mesma coisa sobre a decisão de sepse em qualquer UTI: o gatilho calibrado num sistema hospitalar vale no outro."'
glossario:
  sepse: disfunção de órgão com risco de vida causada por resposta desregulada a infecção (Sepsis-3)
  sepse_3: "definição consensual de 2016 (Singer et al., JAMA): disfunção de órgão com resposta desregulada, operada por SOFA"
  sofa: Sequential Organ Failure Assessment, escore de disfunção de órgão (respiração, coagulação, fígado, cardiovascular, neurológico, renal)
  qsofa: "escore à beira do leito com três itens: PAS ≤ 100 mmHg, FR ≥ 22/min e alteração do estado mental"
  hemocultura: cultura de sangue colhida antes do antibiótico quando se suspeita de infecção
  antibiotico_iv: antibiótico intravenoso, o outro registro da suspeita de infecção
  janela: as 6 primeiras horas registradas da internação na UTI (ICULOS 1 a 6), quando o gatilho é medido
  alarma: SepsisLabel = 1, o registro de que a decisão de sepse já foi tomada (ou está a até 6 h de ser)
  micu: unidade de terapia intensiva médica (Unit1 = 1 no arquivo)
  sicu: unidade de terapia intensiva cirúrgica (Unit2 = 1 no arquivo)
  fr: frequência respiratória, respirações por minuto (coluna Resp)
  spo2: saturação periférica de oxigênio (coluna O2Sat)
  tempo_hospital_uti: horas entre a admissão no hospital e a admissão na UTI (coluna HospAdmTime, com sinal)
  sistema_hospitalar: Beth Israel Deaconess Medical Center (sistema A) e Emory University Hospital (sistema B)
fontes:
  - "PhysioNet/CinC Challenge 2019 (Reynolds et al., Early Prediction of Sepsis from Clinical Data, Crit Care Med 2020, DOI 10.1097/CCM.0000000000004145), dados no espelho aberto https://physionet-open.s3.amazonaws.com/challenge-2019/1.0.0/training/ (ODC-By); manuscrito do desafio no espelho, conferido por busca de texto: três sistemas hospitalares com três prontuários eletrônicos distintos (A = Beth Israel Deaconess, B = Emory, C não identificado), A e B públicos, C sequestrado, rótulo pela definição Sepsis-3 com 'antibióticos IV e hemoculturas dentro de um intervalo de tempo'"
  - "Singer et al. (2016), The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3), JAMA 315:801, DOI 10.1001/jama.2016.0287 — conferido no Europe PMC (título, revista, ano e resumo): a operacionalização clínica da disfunção de órgão é um aumento de 2 pontos ou mais no SOFA"
  - "Seymour et al. (2016), Assessment of Clinical Criteria for Sepsis, JAMA, DOI 10.1001/jama.2016.0288 — conferido no Europe PMC: o qSOFA é '1 point each for systolic hypotension [<=100 mm Hg], tachypnea [>=22/min], or altered mentation', com AUROC 0,66 (IC95% 0,64-0,68) para mortalidade intra-hospitalar nas internações de UTI da coorte de validação (n = 7 932 com suspeita de infecção)"
arquivos: [challenge-2019/1.0.0/training/training_setA, challenge-2019/1.0.0/training/training_setB]
familia: binomial
desfecho: decisão de sepse registrada depois da primeira janela (SepsisLabel = 1 em alguma hora com ICULOS ≥ 7), por internação
chave: fr
candidatos:
  fr: {tipo: num, descricao: maior frequência respiratória da janela, respirações por minuto}
  temp: {tipo: num, descricao: maior temperatura da janela, em graus Celsius}
  pas: {tipo: num, descricao: menor pressão arterial sistólica da janela, em mmHg}
  pad: {tipo: num, descricao: menor pressão arterial diastólica da janela, em mmHg}
  spo2: {tipo: num, descricao: menor saturação periférica de oxigênio da janela, em porcentagem}
  fc: {tipo: num, descricao: maior frequência cardíaca da janela, em batimentos por minuto}
  idade: {tipo: num, descricao: idade em anos}
  sexo: {tipo: num, descricao: Gender como está no arquivo (0 ou 1); constante por internação}
  tempo_hospital_uti: {tipo: num, descricao: horas entre a admissão hospitalar e a da UTI (HospAdmTime, com sinal)}
icp_candidatos: [fr, temp, pas, pad, spo2, fc, idade, sexo, tempo_hospital_uti]
