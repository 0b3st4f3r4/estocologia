area: "Seguros (cauda de incêndios dinamarqueses)"
pacote: h1-real/projetos/c_real.py
familia: "frequencia (Beta; o H1 real não usa GLM)"
escala: frequencia
chave: frequencia_mensal_da_camada
quantidade: "frequência mensal de um mês atingir a camada '100 xs 50' (de 50 a 150 M DKK, por risco)"
unidade_independente: "o mês (bloco de tempo): sinistros do mesmo mês partilham capital, exposição e conjuntura"
desfecho: "um mês em que a camada é atingida (1) ou não (0)"
decisao_em_jogo: "exposição escrita (limite vendido / capital) pelo ressegurador"
acao_na_rodada_a: "0,4 (exposição f)"
status_na_rodada_a: "reprovado: modelo_vence_climatologia"
K_de_hoje: "—"
K_de_hoje_fonte: h1-real/saida/c/resultados.json (não tem campo K)

facilitador: "agente executor do repositorio (conduz, guarda o gabarito e nao elicita)"

pre_teste:
  itens: 20
  semente_do_sorteio: "2026 (sorteio estratificado: 10 sim + 10 nao)"
  pool: ""                        # de onde vieram os 20 itens já resolvidos
  fora_do_cofre_do_dominio: "sim: fatos publicos de seguros e catastrofes de outros mercados e anos; nada da base dinamarquesa de incendios, nada do esquema 100 xs 50, nada da camada de resseguro do dominio"
  gabarito_com: "Swiss Re sigma (1/2025, 1/2024, 3/2024), Munich Re (2023 e 2024), NOAA/NCEI (2023 e 2024), III/Aon, EIOPA e OCDE; os 30 itens tiveram o gabarito localizado pelo facilitador nas proprias copias das dez fontes, 24 de primeira e 6 depois de corrigir a leitura do separador decimal"

