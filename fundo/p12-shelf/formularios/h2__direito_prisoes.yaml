taxa_base: 0.8
chave: negro
quantidade: "razão de chances de liberação com notificação, presos negros contra brancos"
unidade_independente: "a prisão (linha). A base não identifica a pessoa, o policial nem a divisão; reincidentes e prisões do mesmo policial não podem ser agrupados, então o erro padrão por linha pode ser otimista"
desfecho: "liberado com notificação para comparecer (1) ou detido para audiência (0)"
decisao_em_jogo: "adotar diretriz de liberação com notificação como padrão para porte simples, com justificativa escrita para deter"
acao_na_rodada_a: "—"
status_na_rodada_a: "reprovado: modelo_vence_climatologia"
K_de_hoje: "1"
K_de_hoje_fonte: h2/saida/direito_prisoes/resultados.json

facilitador: "agente executor do repositorio (conduz, guarda o gabarito e nao elicita)"

