  gabarito_com: "BJS (PDF baixado e lido com pdftotext), Eurostat, INEGI, UNODC, Sentencing Project e Prison Policy Initiative; os 20 itens administrados tiveram o gabarito reproduzido pelo facilitador na fonte primaria, e os 17 itens em que isso nao aconteceu ficaram fora do sorteio"

