itens_descartados:
  - enunciado: "No ano-base 2019, a expectativa de vida ao nascer do Brasil era maior que 76 anos?"
    motivo: "Duas fontes publicadas discordam da resposta: o Banco Mundial dá 75,809 (não) e a tábua de mortalidade do IBGE dá 76,6 anos para 2019 (sim)."
  - enunciado: "No ano-base 2019, o PIB per capita em paridade de poder de compra da Nigéria era menor que 8.000 dólares internacionais?"
    motivo: "Duas séries do próprio Banco Mundial discordam da resposta: preços correntes 7.551,39 (sim) contra a série em preços constantes publicada pelo Our World in Data, 8.361,79 (não)."
  - enunciado: "No ano-base 2019, o PIB per capita em paridade de poder de compra do Catar era maior que 110.000 dólares internacionais?"
    motivo: "Correntes 107.502,47 (não) contra constantes 113.160,98 (sim): o item fecha em uma base de preços e não na outra."
  - enunciado: "No ano-base 2019, a parcela da população com 65 anos ou mais na Coreia do Sul era maior que 15%?"
    motivo: "15,0635% da população: margem de 0,06 ponto percentual, qualquer revisão da série inverte a resposta."
  - enunciado: "No ano-base 2019, a expectativa de vida ao nascer da China era maior que 78 anos?"
    motivo: "77,940 anos: margem de 0,06 ano; a revisão da UN WPP já desloca esse valor em mais de uma década de fração de ano."
  - enunciado: "No ano-base 2019, a expectativa de vida ao nascer de Cuba era maior que 77 anos?"
    motivo: "77,413 anos: margem de 0,41 ano e séries divergentes para Cuba na década de 2010 (WPP contra OOPS/OMS)."
  - enunciado: "No ano-base 2019, a taxa de mortalidade infantil da Índia era menor que 30 por mil nascidos vivos?"
    motivo: "29,8 no Banco Mundial e 29,76 no UN IGME: a margem de 0,2 a 0,3 óbito por mil é menor que a revisão anual da série."
  - enunciado: "No ano-base 2019, o número de médicos por mil habitantes na Rússia era maior que 4,5?"
    motivo: "Série instável: 4,097 em 2018, 4,165 em 2019, 3,807 em 2020 e 5,087 em 2021 no mesmo indicador, sem quebra documentada."
  - enunciado: "No ano-base 2021, a expectativa de vida ao nascer da Rússia era menor que 70 anos?"
    motivo: "69,900 anos: margem de 0,1 ano, abaixo da revisão entre edições da UN WPP."
