itens_descartados:
  - enunciado: "No ano-base 2021, as perdas seguradas globais por catástrofes naturais eram maiores que 115 bilhões de dólares?"
    motivo: "Dois números publicados discordam sobre a resposta: a Swiss Re sigma publica 111 bilhões de dólares para 2021 (valor citado na tabela do Insurance Information Institute) e a Munich Re publica 120 bilhões de dólares no comunicado de janeiro de 2022. A resposta muda com a fonte, então o item sai pela regra 4."
  - enunciado: "No ano-base 2024, o capital tradicional do mercado mundial de resseguro era maior que 400 bilhões de dólares?"
    motivo: "Número conferido no sigma 1/2025 (cerca de 500 bilhões de dólares, mais cerca de 50 bilhões de capital alternativo, dos quais o mercado de títulos de catástrofe), mas o estudo o apresenta como estimativa corrente na data de publicação e não fixa o ano-base 2024 exigido pela janela do pool; fica reservado para uma segunda rodada."
  - enunciado: "No ano-base 2024, o volume mundial de prêmios de seguro era maior que 7,5 trilhões de dólares?"
    motivo: "O único número da Swiss Re para 2024 é uma projeção ('we estimate that ... premiums (life and non-life) will grow by 3.2% in real terms this year to USD 7.6 trillion'), e o pool exige fato resolvido, não previsão (regra 2)."
