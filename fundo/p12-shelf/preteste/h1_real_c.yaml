dominio: h1-real/c
area: seguros e cauda pesada de perdas (perdas por catastrofe seguradas, penetracao e capacidade)
gerado_por: pool de itens do pre-teste
fonte_do_pool: pesquisa em fonte publica, cada item com URL conferida
itens:
  - id: C01
    enunciado: "No ano-base 2024, as perdas seguradas por catástrofes naturais no mundo eram maiores que 100 bilhões de dólares?"
    resolucao: sim
    numero: "137 bilhões de dólares em 2024, contra 108 bilhões em 2023; a série segue taxa de crescimento de 5% a 7% ao ano em termos reais"
    fonte_url: "https://www.swissre.com/institute/research/sigma-research/sigma-2025-01-natural-catastrophes-trend.html"
    fonte_titulo: "sigma 1/2025: Natural catastrophes: insured losses on trend to USD 145 billion in 2025, Swiss Re Institute, publicado em 2025 (perdas do ano-base 2024)"
    ano_base: 2024
    dificuldade: facil
  - id: C02
