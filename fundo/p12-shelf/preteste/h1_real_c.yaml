    numero: "318 bilhões de dólares em 2024 (280 bilhões em 2023); a Munich Re publica 320 bilhões para o mesmo ano, e os dois valores cruzam o limiar"
    fonte_url: "https://www.swissre.com/institute/research/sigma-research/sigma-2025-01-natural-catastrophes-trend.html"
    fonte_titulo: "sigma 1/2025: Natural catastrophes: insured losses on trend to USD 145 billion in 2025, Swiss Re Institute, publicado em 2025 (perdas do ano-base 2024)"
