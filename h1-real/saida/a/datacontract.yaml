nome: djia_pregoes
versao: '1.0'
colunas:
  data:
    tipo: str
  periodo:
    tipo: int
    min: 1
    max: 99
  ano:
    tipo: int
    min: 1885
    max: 9999
  dia:
    tipo: int
    min: 1
    max: 400
  dias_corridos:
    tipo: int
    min: 1
    max: 400
  fechamento:
    tipo: float
    min: 0.0
  origem:
    tipo: str
    valores:
    - real
    - reamostrado
    - perturbado
  retorno:
    tipo: float
    min: -1.0
    max: 1.0
chave:
- ano
- dia
particao: periodo
grao: uma linha por pregão; 'ano' ≥ 3000 marca lote sintético (reamostrado ou perturbado),
  com 'data' real de origem
ausencia:
  mecanismo: MCAR
  colunas: []
  sensibilidade:
    feito: false
    metodos: []
  nota: 'a ausência é de LINHA, não de célula: não há pregão nos feriados nem nos
    135 dias corridos de jul–dez/1914 (fechamento da bolsa). O motivo é do calendário
    da bolsa, não do valor do retorno; o caso de 1914 já está declarado como limite
    em ''fisica_do_ruido'' e nenhum pregão é imputado nem descartado'
