    CPS). Renda zero em re74/re75 é valor OBSERVADO (''sem renda no ano''), não ausente:
    entra no desenho com indicador próprio (r74 == 0). A distinção entre MAR e MNAR,
    que só importaria com célula vazia, não é testável nos dados observados (Cap.
    3) e fica declarada como premissa, não como fato'
