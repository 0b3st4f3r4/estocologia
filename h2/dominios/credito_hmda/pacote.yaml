ambientes:
  descricao: >-
    AMBIENTE FRACO, declarado antes de qualquer resultado. A base não tem geografia nem banco; o único corte externo ao
    requerente é a taxa de desemprego de Massachusetts no setor em que ele trabalha (1989), agrupada em quatro faixas
    (baixo ≤ 2,0%, médio 3,1–3,2%, alto 3,6–4,3%, muito alto ≥ 5,3%); a faixa "alto" (623 pedidos) fica no cofre, nunca
    vista. Argumento a favor: o setor muda a composição dos requerentes (X) e as normas de subscrição olham as razões,
    o histórico e o LTV do próprio requerente, não a taxa do setor. Argumento contra: Munnell et al. incluíram essa taxa
    como regressor justamente porque o banco pode pesar o risco de emprego, o que age direto em Y; e a composição de X
    pouco muda entre as faixas (médias de razão dívida/renda, LTV e histórico quase iguais), então o ambiente quase não
    intervém em X e o ICP tem pouco poder. O estado civil (vedado como critério pelo ECOA) seria o ambiente mais
    defensável, mas tem só dois níveis e não deixa ambiente para o cofre
  cofre: [alto]
unidade: >-
  o pedido de financiamento (linha). A base não identifica o banco; pedidos do mesmo banco compartilham política de
  subscrição e não podem ser agrupados, então o erro padrão por pedido pode ser otimista
cabecalho:
  processo_gerador: O requerente apresenta renda, dívidas, garantia e histórico; a seguradora decide sobre o seguro hipotecário; o banco, vendo também a raça registrada, aprova ou nega.
  nao_linearidade: Escala logística; LTV entra por limiares (0,80 e 0,95) usados pelos bancos; históricos como escores lineares no logit.
  unidade_e_margem: O pedido é a unidade (sem identificador de banco); margem com erro padrão por pedido.
  fisica_do_ruido: Bernoulli por pedido, com heterogeneidade não observada de banco e de atributos do dossiê ausentes da base.
  escada_causal: >-
    Degrau 1 (observacional). Seguindo Greiner & Rubin (2011), o tratamento é a raça percebida pelo banco no momento da
    análise; renda, dívidas, garantia e histórico existem antes dessa percepção e entram como pré-tratamento (são
    efeitos da raça de origem, nó latente, e fecham a porta dos fundos). O seguro negado vem depois da percepção racial
    da seguradora e é tratado como mediador, fora do ajuste. Premissa não testável - nenhum atributo do dossiê fora da
    base (a crítica de variável omitida a Munnell et al.) liga a raça de origem à negação.
shelf:
  quantidade: razão de chances de negação, requerente negro contra branco, mantido o dossiê de crédito
  escala: razao_de_chances
  fonte: >-
    estudos de discriminação hipotecária anteriores e externos a esta base (Black, Schweitzer & Mandell 1978; Schafer &
    Ladd 1981), com razões de chances ajustadas em torno de 1,5 a 2; taxa de negação nacional ~14% em 1990 (Canner &
    Smith 1991); citados de memória, por conferir. O resultado do próprio Fed de Boston (Munnell et al. 1996) foi
    deixado de fora para não usar os mesmos dados duas vezes. Nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  taxa_base: 0.12
  quartis: {q05: 1.0, q25: 1.35, q50: 1.6, q75: 1.9, q95: 2.6}
decisao:
  acao: exigir segunda revisão independente de todo pedido negado de requerente negro
  beneficio_por_unidade: 50.0
  custo: 2.0
  custo_pesquisa: 0.1
  nota: >-
    utilidade em negações-indevidas-evitadas-equivalentes por 100 requerentes negros; supõe-se que a segunda revisão
    reverte metade do excesso de negações (benefício = 50·θ); o custo de 2 equivalentes por 100 requerentes (horas de
    analista, atraso) e o custo da pesquisa são suposições, a elicitar com o regulador
termo_escopo:
  vale_para: pedidos de financiamento imobiliário convencional na região metropolitana de Boston em 1990, requerentes negros e brancos
  nao_vale_para: outros mercados e anos, subscrição automatizada moderna, requerentes hispânicos e asiáticos (fora desta base), a decisão da seguradora
pergunta_do_decisor: >-
  Quem decide: o banco que decide aprovar ou negar financiamento imobiliário em Boston em 1990. Ação que a decisão muda: exigir segunda revisão independente de todo pedido negado de requerente negro. A pergunta do decisor é: a segunda revisão independente reverte o excesso de negações de requerentes negros?
tentativas_de_especificacao: 1
tem_titulares: true
