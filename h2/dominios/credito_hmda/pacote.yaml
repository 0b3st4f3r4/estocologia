nome: credito_hmda
area: Crédito
titulo: Raça e negação de financiamento imobiliário em Boston (HMDA, 1990)
pergunta: Com o mesmo dossiê de crédito, ser percebido como negro aumenta a chance de ter o financiamento negado, e a diferença vale numa faixa de setores que o modelo não viu?
alegacao: '"Mesmo controlando por renda, histórico de crédito e garantia, bancos de Boston negam mais financiamentos a requerentes negros."'
glossario:
  HMDA: Home Mortgage Disclosure Act, lei que obriga bancos a declarar pedidos de financiamento e seus desfechos
  negacao: pedido de financiamento recusado pelo banco
  razao_divida_renda: total de pagamentos de dívidas sobre a renda mensal
  razao_moradia_renda: despesa prevista com moradia sobre a renda mensal
  LTV: valor do empréstimo sobre o valor do imóvel (loan-to-value)
  seguro_hipotecario: seguro privado exigido quando o LTV passa de 80%, concedido por outra empresa
  historico_de_credito: pontuação de atrasos em crédito ao consumidor e em hipotecas anteriores
  tratamento_desigual: decisão que muda pela raça percebida, mantido o dossiê (disparate treatment)
  impacto_desigual: regra neutra na forma que prejudica mais um grupo (disparate impact)
  raca_percebida: a raça como o banco a registra e enxerga no momento da análise (Greiner & Rubin)
fontes:
  - Munnell, A. H., Tootell, G. M. B., Browne, L. E. & McEneaney, J. (1996). Mortgage lending in Boston - interpreting HMDA data. American Economic Review 86(1), 25–53 (citado de memória, por conferir)
  - Canner, G. B. & Smith, D. S. (1991). Home Mortgage Disclosure Act - expanded data on residential lending. Federal Reserve Bulletin 77, 859–881 (citado de memória, por conferir)
  - Greiner, D. J. & Rubin, D. B. (2011). Causal effects of perceived immutable characteristics. Review of Economics and Statistics 93(3), 775–785 (citado de memória, por conferir)
  - Stock, J. H. & Watson, M. W., Introduction to Econometrics, cap. 11 (base HMDA); pacote AER do R
  - dados-reais/h2/AER_HMDA.csv (Rdatasets AER::HMDA)
arquivos: [AER_HMDA.csv]
familia: binomial
desfecho: pedido de financiamento negado (1) ou aprovado (0)
