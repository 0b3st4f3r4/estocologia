nome: desenvolvimento_preston
area: Desenvolvimento
titulo: A curva de Preston - renda e expectativa de vida em 142 países (1952–2007)
pergunta: Quantos anos de expectativa de vida acompanham cada unidade de log do PIB per capita, comparando países no mesmo período e continente, e a relação aprendida até 1992 vale para 1997–2007?
alegacao: '"Dobrar a renda de um país rende uns 4 a 5 anos de vida, em qualquer época; crescimento é a melhor política de saúde."'
glossario:
  expectativa_de_vida: anos que um recém-nascido viveria com as taxas de mortalidade do período
  PIB_per_capita: produto interno bruto por habitante em dólares de paridade de poder de compra constantes
  curva_de_Preston: relação côncava entre renda per capita e expectativa de vida entre países
  deslocamento_da_curva: subida da curva inteira ao longo do tempo para a mesma renda (tecnologia de saúde)
  paridade_de_poder_de_compra: conversão que iguala o custo de uma cesta de bens entre países
  transicao_epidemiologica: troca de doenças infecciosas por crônicas como causa principal de morte
  difusao_tecnologica: chegada de vacinas, antibióticos e saneamento a países pobres
  epidemia_de_HIV: alta da mortalidade adulta na África subsaariana a partir dos anos 1990
  log_renda: logaritmo natural do PIB per capita; uma unidade equivale a multiplicar a renda por e ≈ 2,72
  onda_quinquenal: observação a cada 5 anos (1952, 1957, ..., 2007)
fontes:
  - "Preston (1975), The changing relation between mortality and level of economic development, Population Studies 29 — citado de memória, por conferir"
  - "Pritchett & Summers (1996), Wealthier is healthier, Journal of Human Resources — citado de memória, por conferir"
  - "Deaton (2003), Health, inequality, and economic development, Journal of Economic Literature — citado de memória, por conferir"
  - "Gapminder Foundation (via pacote gapminder de J. Bryan)"
  - dados-reais/h2/gapminder_gapminder.csv (Rdatasets)
arquivos: [gapminder_gapminder.csv]
familia: gaussiana
desfecho: expectativa de vida ao nascer (anos)
chave: log_pib
candidatos:
  log_pib: {tipo: num, descricao: log natural do PIB per capita}
  decadas_desde_1952: {tipo: num, descricao: tempo de calendário em décadas (deslocamento de Preston)}
  continente: {tipo: cat, descricao: "África, Américas, Ásia, Europa ou Oceania"}
icp_candidatos: [log_pib, decadas_desde_1952, continente]
ajuste: [decadas_desde_1952, continente]
dag:
  - [log_pib, y]
  - [decadas_desde_1952, log_pib]
  - [decadas_desde_1952, y]
  - [continente, log_pib]
  - [continente, y]
ambientes:
  descricao: >-
    Período de calendário: 1952–1962, 1967–1977 e 1982–1992 no treino; 1997–2007 no cofre, nunca visto. Por que período e
    não continente: o continente age direto na expectativa de vida dada a renda (ecologia de doenças, malária, HIV), que
    é exatamente o tipo de ambiente que derrubou o ICP nos pilotos; aqui ele vira candidato. O período muda a
    distribuição da renda (crescimento) e age em Y pelo deslocamento tecnológico da curva, que entra como o candidato
    tempo de calendário. Violação plausível declarada: o HIV na África dos anos 1990 e o colapso pós-soviético são
    choques de período que não passam pelos candidatos.
  cofre: [1997-2007]
unidade: o país (142); as 12 ondas de um país dividem instituições, geografia e erros de medida
cabecalho:
  processo_gerador: A renda financia nutrição, saneamento e serviços de saúde; a tecnologia de saúde se difunde com o tempo e desloca a curva para cima a renda fixa.
  nao_linearidade: Côncava em nível de renda, aproximadamente linear no log; achatamento residual em rendas altas fica como risco.
  unidade_e_margem: O país é a unidade (142 países; 1278 país-ondas no treino); erro padrão agrupado por país.
  fisica_do_ruido: Erro de medida de expectativa de vida em países sem registro civil (interpolada por modelos), choques de guerra e fome com caudas pesadas.
  escada_causal: "Degrau 1 (observacional, entre países). Premissa não testável: nada além de continente e tempo confunde renda e saúde; a causalidade reversa (saúde gera renda) não está no DAG e inflaria θ."
shelf:
  quantidade: anos de expectativa de vida por unidade de log natural do PIB per capita
  fonte: >-
    literatura da curva de Preston (Preston 1975; Pritchett & Summers 1996; Deaton 2003), citada de memória e por
    conferir; nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: 3, q25: 5, q50: 6.5, q75: 8, q95: 10.5}
decisao:
  acao: priorizar crescimento da renda (em vez de programas de saúde diretos) como via para aumentar a expectativa de vida
  beneficio_por_unidade: 1.0
  custo: 5.0
  custo_pesquisa: 0.05
  nota: >-
    utilidade em anos de vida por unidade de log da renda (escala do próprio θ); a via da renda compensa se θ passa
    de 5 anos, o equivalente suposto dos programas diretos. Custo (5) e custo de pesquisa (0,05) são suposições, não medidas
termo_escopo:
  vale_para: comparação entre países de 1952 a 2007 com renda entre ~US$ 250 e ~US$ 110 mil PPC, no mesmo período e continente
  nao_vale_para: efeito de crescimento dentro de um país ao longo do tempo, desigualdade interna, choques epidêmicos e guerras, anos depois de 2007
pergunta_do_decisor: >-
  Quem decide: o formulador que escolhe entre crescimento da renda e programas de saúde diretos. Ação que a decisão muda: priorizar crescimento da renda (em vez de programas de saúde diretos) como via para aumentar a expectativa de vida. A pergunta do decisor é: a renda sobe a expectativa de vida pela mesma curva entre países?
tentativas_de_especificacao: 1
tem_titulares: false
