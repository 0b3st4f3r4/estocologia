nome: energia_vitoria
area: Energia
titulo: Calor e demanda elétrica diária em Victoria, Austrália (2012–2014)
pergunta: Quanto cada grau-dia de resfriamento acrescenta à demanda elétrica média do dia em Victoria, e a relação aprendida em 2012–2013 vale para 2014?
alegacao: '"Em Victoria, cada grau acima de 18 °C na média do dia acrescenta uns 120 MW de demanda média, por causa do ar-condicionado; a relação é estável de um ano para o outro."'
glossario:
  demanda_operacional: potência elétrica média atendida pela rede no intervalo (MW)
  graus_dia_resfriamento: quanto a temperatura média do dia passa de 18 °C (°C·dia), substituto da carga de ar-condicionado
  graus_dia_aquecimento: quanto a temperatura média do dia fica abaixo de 18 °C (°C·dia), substituto da carga de aquecimento
  temperatura_base: temperatura (18 °C) em que nem aquecimento nem resfriamento são acionados, por convenção
  inercia_termica: calor guardado em prédios num dia quente que aumenta a carga do dia seguinte
  onda_de_calor: sequência de dias muito quentes; em Victoria provoca os picos anuais de demanda
  carga_de_iluminacao: parte da demanda que depende de quantas horas de luz natural o dia tem
  resposta_da_demanda: contrato em que grandes consumidores reduzem a carga quando o operador pede
  NEM: Mercado Nacional de Eletricidade da Austrália, operado pela AEMO
  geracao_solar_de_telhado: geração atrás do medidor que reduz a demanda vista pela rede
fontes:
  - "AEMO, dados de demanda operacional de Victoria (via tsibbledata::vic_elec, O'Hara-Wild, Hyndman & Wang)"
  - "Bureau of Meteorology, temperatura de Melbourne (via tsibbledata::vic_elec)"
  - "Hyndman & Fan (2010), Density forecasting for long-term peak electricity demand, IEEE Transactions on Power Systems — citado de memória, por conferir"
  - "Hyndman & Athanasopoulos, Forecasting: Principles and Practice, 3.ª ed. (exemplos com vic_elec) — citado de memória, por conferir"
  - dados-reais/h2/tsibbledata_vic_elec.csv (Rdatasets)
arquivos: [tsibbledata_vic_elec.csv]
familia: gaussiana
desfecho: demanda elétrica média do dia em Victoria (MW), média das 48 meias-horas
chave: graus_dia_resfriamento
candidatos:
  graus_dia_resfriamento: {tipo: num, descricao: "max(temperatura média do dia − 18 °C, 0)"}
  graus_dia_aquecimento: {tipo: num, descricao: "max(18 °C − temperatura média do dia, 0)"}
  resfriamento_ontem: {tipo: num, descricao: graus-dia de resfriamento da véspera (inércia térmica)}
  horas_de_luz: {tipo: num, descricao: duração astronômica do dia em Melbourne (horas)}
  feriado: {tipo: num, descricao: feriado público em Victoria}
  dia_semana: {tipo: cat, descricao: "dia útil, sábado ou domingo"}
icp_candidatos: [graus_dia_resfriamento, graus_dia_aquecimento, resfriamento_ontem, horas_de_luz, feriado, dia_semana]
ajuste: [graus_dia_aquecimento, resfriamento_ontem, horas_de_luz, feriado, dia_semana]
dag:
  - [graus_dia_resfriamento, y]
  - [graus_dia_aquecimento, y]
  - [resfriamento_ontem, y]
  - [horas_de_luz, y]
  - [feriado, y]
  - [dia_semana, y]
  - [temperatura_media, graus_dia_resfriamento]
  - [temperatura_media, graus_dia_aquecimento]
  - [temperatura_ontem, temperatura_media]
  - [temperatura_ontem, resfriamento_ontem]
  - [estacao, temperatura_media]
  - [estacao, temperatura_ontem]
  - [estacao, horas_de_luz]
  - [tendencia_estrutural, y]
ambientes:
  descricao: >-
    Treino: estação do ano (verão DJF, outono MAM, inverno JJA, primavera SON) com 2012 e 2013 juntos; cofre: o ano de
    2014 inteiro, nunca visto. Por que estações e não anos: a estação muda fortemente a distribuição dos preditores
    (temperatura, graus-dia, horas de luz), e o efeito direto da estação sobre a demanda passa, na nossa premissa, pelas
    horas de luz (iluminação) e pela temperatura, que são candidatos. A tendência estrutural entre anos (solar de telhado,
    eficiência), que age direto em Y, fica igual em todos os ambientes de treino porque cada estação junta os dois anos;
    ela só aparece no cofre, onde é exatamente o que o teste fora do ambiente deve medir. Violações plausíveis que
    ficam declaradas: férias escolares de verão e hábitos sazonais agem em Y sem passar pelos candidatos.
  cofre: ["2014"]
unidade: >-
  a semana (157 semanas, identificadas pela segunda-feira): dias da mesma semana dividem o mesmo regime de tempo
  (frentes, ondas de calor) e o mesmo padrão de consumo, então os resíduos diários são autocorrelacionados dentro dela
cabecalho:
  processo_gerador: A demanda diária é carga de base (indústria, comércio, residências) mais carga térmica de aquecimento em dias frios e de ar-condicionado em dias quentes, modulada por calendário e luz.
  nao_linearidade: A resposta à temperatura tem forma de U; os graus-dia de aquecimento e de resfriamento com base 18 °C linearizam os dois ramos. A convexidade residual em ondas de calor extremas fica como risco de má especificação.
  unidade_e_margem: A semana é a unidade (~105 semanas no treino contra ~730 dias); erro padrão agrupado por semana.
  fisica_do_ruido: Ruído aproximadamente gaussiano na média diária, com autocorrelação por regimes de tempo de vários dias e dias atípicos (feriados prolongados, falhas).
  escada_causal: Degrau 1 (observacional), mas a temperatura é exógena ao consumo (ninguém escolhe o clima); premissa não testável - a estação não age em Y fora dos candidatos.
shelf:
  quantidade: aumento da demanda média diária (MW) por grau-dia de resfriamento (base 18 °C)
  fonte: >-
    literatura de previsão de demanda no sudeste da Austrália (Hyndman & Fan 2010; relatórios de previsão da AEMO),
    citada de memória e por conferir; a tradução para a escala de demanda média diária por grau-dia é nossa;
    nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: 40, q25: 90, q50: 120, q75: 150, q95: 210}
decisao:
  acao: contratar um programa de resposta da demanda acionado por previsão de graus-dia de resfriamento
  beneficio_por_unidade: 1.0
  custo: 100.0
  custo_pesquisa: 1.0
  nota: >-
    utilidade em MW médios de carga gerenciável por °C·dia (escala do próprio θ); o programa compensa se a
    sensibilidade passa de 100 MW por grau-dia. O custo (100) e o custo de pesquisa (1) são suposições a elicitar
    com o operador do mercado, não valores medidos
termo_escopo:
  vale_para: demanda agregada de Victoria, clima de Melbourne, parque de ar-condicionado e solar de telhado de 2012–2014, resolução diária
  nao_vale_para: picos de meia hora, outros estados do NEM, anos com outra penetração de solar ou de ar-condicionado, temperaturas fora do intervalo observado
pergunta_do_decisor: >-
  Quem decide: o operador da rede de Victoria que contrata a resposta da demanda. Ação que a decisão muda: contratar um programa de resposta da demanda acionado por previsão de graus-dia de resfriamento. A pergunta do decisor é: os graus-dia de resfriamento preveem a carga pela mesma lei?
tentativas_de_especificacao: 1
tem_titulares: false
