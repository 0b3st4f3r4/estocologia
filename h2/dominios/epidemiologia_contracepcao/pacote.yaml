nome: epidemiologia_contracepcao
area: Epidemiologia
titulo: Filhos vivos e uso de contraceptivos em Bangladesh (Pesquisa de Fecundidade, 1988–89)
pergunta: Ter ao menos um filho vivo aumenta a chance de uma mulher casada usar contracepção, e a relação vale num grupo de distritos que o modelo não viu?
alegacao: '"Em Bangladesh a contracepção é usada para espaçar e limitar depois do primeiro filho; integrar a oferta ao pós-parto alcança quem vai usar, em qualquer distrito."'
glossario:
  uso_atual: mulher declara usar algum método contraceptivo no momento da entrevista
  filhos_vivos: número de filhos nascidos vivos que estão vivos na entrevista (0, 1, 2, 3 ou mais)
  espacamento: uso de contracepção para adiar o próximo nascimento
  limitacao: uso de contracepção para não ter mais filhos
  necessidade_insatisfeita: mulher que não quer engravidar e não usa método
  taxa_de_prevalencia: fração de mulheres casadas em idade fértil que usam contracepção
  distrito: unidade administrativa de Bangladesh e conglomerado da amostra
  trabalhadora_de_campo: agente de planejamento familiar que visita domicílios rurais
  pos_parto: período após o parto, momento de contato com o serviço de saúde
  amenorreia_lactacional: infertilidade temporária pela amamentação, que adia a necessidade de método
fontes:
  - Huq, N. M. & Cleland, J. (1990). Bangladesh Fertility Survey 1989 (Main Report). National Institute of Population Research and Training, Daca (citado de memória, por conferir)
  - Steele, F., Diamond, I. & Amin, S. (1996). Immunization uptake in rural Bangladesh - a multilevel analysis. JRSS A 159(2), 289–299 (citado de memória, por conferir; mesma família de dados)
  - Bates, D. et al., pacote mlmRev do R, base Contraception
  - dados-reais/h2/mlmRev_Contraception.csv (Rdatasets mlmRev::Contraception)
arquivos: [mlmRev_Contraception.csv]
familia: binomial
desfecho: usa contraceptivo atualmente (1) ou não (0)
chave: tem_filhos
candidatos:
  tem_filhos: {tipo: num, descricao: ao menos um filho vivo}
  filhos_3mais: {tipo: num, descricao: três ou mais filhos vivos}
  idade: {tipo: num, descricao: idade centrada na média (anos)}
  idade_quad: {tipo: num, descricao: idade centrada ao quadrado / 10}
  urbano: {tipo: num, descricao: residência urbana}
icp_candidatos: [tem_filhos, filhos_3mais, idade, idade_quad, urbano]
ajuste: [idade, idade_quad, urbano]
dag:
  - [tem_filhos, y]
  - [tem_filhos, filhos_3mais]
  - [filhos_3mais, y]
  - [idade, tem_filhos]
  - [idade, filhos_3mais]
  - [idade, idade_quad]
  - [idade, y]
  - [idade_quad, y]
  - [urbano, tem_filhos]
  - [urbano, filhos_3mais]
  - [urbano, y]
ambientes:
  descricao: >-
    quatro grupos de 15 distritos pela ordem do código do distrito (g1 a g4); g4 (distritos 46 a 61) fica no cofre,
    nunca visto. Escolha feita antes de qualquer resultado. Urbano/rural foi descartado como ambiente: só há dois
    níveis (o ICP exige dois de treino além do cofre) e a residência urbana age direto no uso pela oferta de serviços,
    por isso entra como candidata. Os grupos de distritos mudam a composição de idade, paridade e urbanização (X); se a
    decisão de usar dada a fase da vida reprodutiva for estável, Y|X é invariante. Fraquezas declaradas: não se sabe
    se o código segue a geografia (por conferir), e a intensidade do programa de planejamento familiar varia entre
    distritos e age direto em Y
  cofre: [g4]
unidade: o distrito (60 distritos, 45 no treino), conglomerado do desenho amostral, com oferta de serviços e normas comuns
cabecalho:
  processo_gerador: Mulheres casadas são amostradas por conglomerados distritais e declaram o uso atual de contracepção, a idade e os filhos vivos.
  nao_linearidade: Escala logística; uso cresce de forma abrupta do primeiro filho em diante (chave binária) e segue um U invertido com a idade (termo quadrático).
  unidade_e_margem: O distrito é a unidade; margem com erro padrão agrupado por distrito.
  fisica_do_ruido: Bernoulli por mulher, com efeito aleatório de distrito (oferta, normas, acesso).
  escada_causal: "Degrau 1 (observacional). Ter filhos não é sorteado; idade e urbanização ajustadas como confundidores; fecundabilidade e preferência por família grande ficam como confundidores ocultos (mulheres que já usavam método têm menos filhos, causação reversa)."
shelf:
  quantidade: razão de chances de uso atual, mulheres com ao menos um filho vivo contra sem filhos
  escala: razao_de_chances
  fonte: >-
    relatórios de pesquisas de fecundidade e DHS do sul da Ásia (uso entre mulheres casadas sem filhos muito abaixo do
    das com filhos) e prevalência nacional de ~31% em 1989; citados de memória, por conferir. Nenhum especialista humano
    consultado
  painel: literatura publicada; nenhum especialista humano consultado
  taxa_base: 0.35
  quartis: {q05: 1.5, q25: 2.4, q50: 3.2, q75: 4.3, q95: 7.0}
decisao:
  acao: integrar a oferta de contraceptivos ao atendimento pós-parto em vez de visitas uniformes a todas as casadas
  beneficio_por_unidade: 100.0
  custo: 20.0
  custo_pesquisa: 0.5
  nota: >-
    utilidade em usuárias-equivalentes por 100 mulheres atendidas; benefício = 100·θ (usuárias a mais por focar quem já
    tem filho); o custo de 20 usuárias-equivalentes (cobertura perdida entre as sem filhos e montagem do serviço) e o
    custo da pesquisa são suposições, a elicitar com o programa nacional de planejamento familiar
termo_escopo:
  vale_para: mulheres casadas de Bangladesh no fim dos anos 1980, nos distritos amostrados pela pesquisa
  nao_vale_para: Bangladesh atual (prevalência acima de 60%), mulheres não casadas, outros países, efeito de ter o segundo ou terceiro filho
pergunta_do_decisor: >-
  Quem decide: o serviço de saúde que decide onde ofertar contraceptivos (Bangladesh, 1988–89). Ação que a decisão muda: integrar a oferta de contraceptivos ao atendimento pós-parto em vez de visitas uniformes a todas as casadas. A pergunta do decisor é: focar quem já tem filhos aumenta a oferta pela mesma lei?
tentativas_de_especificacao: 1
tem_titulares: true
quase_ids: [tem_filhos, filhos_3mais, urbano, idade]
grupo_justica: urbano
