nome: saude_consultas
area: Saúde
titulo: Seguro suplementar privado e consultas médicas de idosos nos EUA (NMES 1987–88)
pergunta: Ter seguro suplementar privado aumenta o número de consultas médicas de idosos com Medicare, comparando pessoas com a mesma saúde e renda, e o efeito estimado em três regiões vale no Oeste?
alegacao: '"Idosos com seguro suplementar privado vão ao médico uns 20% a mais, porque a coparticipação cai - não porque sejam mais doentes."'
glossario:
  Medicare: seguro público federal dos EUA para pessoas de 65 anos ou mais
  Medicaid: seguro público para pessoas de baixa renda, que cobre o que o Medicare não cobre
  seguro_suplementar: plano privado (Medigap) que paga franquias e coparticipações do Medicare
  coparticipacao: parte do preço da consulta paga pelo próprio paciente
  risco_moral: aumento do uso de serviços quando o preço pago pelo paciente cai
  selecao_adversa: pessoas que esperam usar mais serviços compram mais seguro
  consulta_em_consultorio: visita a médico no consultório, sem internação nem emergência
  doenca_cronica: condição de longa duração (hipertensão, diabetes, câncer etc.), contada por pessoa
  limitacao_funcional: dificuldade em atividades da vida diária (ADL)
  saude_autodeclarada: avaliação da própria saúde - ruim, média ou excelente
fontes:
  - "Deb & Trivedi (1997), Demand for medical care by the elderly: a finite mixture approach, Journal of Applied Econometrics 12 — citado de memória, por conferir"
  - "Manning et al. (1987), Health insurance and the demand for medical care (RAND HIE), American Economic Review — citado de memória, por conferir"
  - "AHCPR, National Medical Expenditure Survey 1987 (via AER::NMES1988, Kleiber & Zeileis)"
  - dados-reais/h2/AER_NMES1988.csv (Rdatasets)
arquivos: [AER_NMES1988.csv]
familia: gaussiana
desfecho: log(1 + número de consultas em consultório médico no ano)
chave: seguro_privado
