ambientes:
  descricao: >-
    Região de residência (centro-oeste, nordeste e "outra" no treino; oeste no cofre, nunca visto). Por que região: a
    região muda a distribuição dos preditores - cobertura privada e Medicaid, renda, escolaridade e composição racial
    diferem muito entre regiões -, e na nossa premissa o número de consultas dado saúde, renda e cobertura não depende
    de onde a pessoa mora. Violação plausível declarada: estilos de prática médica regionais (variação de Wennberg) e a
    oferta de médicos por habitante agem direto em Y; não há candidato que os absorva. Não há ambiente melhor na base -
    os outros agrupamentos seriam funções dos próprios candidatos.
  cofre: [west]
unidade: a pessoa (4406 idosos, uma linha cada); amostra transversal, o desenho por conglomerados da pesquisa não está na base
cabecalho:
  processo_gerador: A pessoa adoece e decide procurar o médico; o seguro suplementar baixa o preço pago no consultório; quem espera usar mais compra mais seguro (seleção).
  nao_linearidade: Contagem com muitos zeros e cauda longa; log(1 + consultas) torna o modelo aproximadamente aditivo, com efeitos em pontos de log.
  unidade_e_margem: A pessoa é a unidade (3608 no treino); erro padrão agrupado por pessoa, que equivale ao robusto.
  fisica_do_ruido: Contagem super-dispersa; após o log1p o resíduo é assimétrico e tem um bloco nos zeros (~15%).
  escada_causal: "Degrau 1 (observacional). Premissa não testável: a seleção adversa passa toda por saúde, doenças crônicas e limitação medidas; preferências não observadas por cuidado médico viesariam θ para cima."
shelf:
  quantidade: diferença em pontos de log(1 + consultas) entre ter e não ter seguro suplementar privado
  fonte: >-
    Deb & Trivedi (1997) com estes mesmos dados (coeficiente do seguro privado nos modelos de contagem) e o experimento
    RAND (Manning et al. 1987), citados de memória e por conferir; nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: 0.0, q25: 0.12, q50: 0.20, q75: 0.28, q95: 0.42}
decisao:
  acao: subsidiar o seguro suplementar para idosos sem cobertura privada, a fim de ampliar o acesso a consultas
  beneficio_por_unidade: 100.0
  custo: 15.0
  custo_pesquisa: 0.5
  nota: >-
    utilidade em pontos por pessoa-ano, com 1 ponto = 1% a mais de consultas (100 por ponto de log); o subsídio
    compensa se o efeito passa de 0,15 ponto de log. Custo (15) e custo de pesquisa (0,5) são suposições, não medidas
termo_escopo:
  vale_para: idosos de 66 anos ou mais com Medicare nos EUA em 1987–88, consultas em consultório
  nao_vale_para: menores de 65, sistemas de saúde de outros países, internações e emergências, o mercado de seguro depois da Parte D e do Medicare Advantage
pergunta_do_decisor: >-
  Quem decide: o formulador que decide subsidiar o seguro suplementar dos idosos (EUA, 1987–88). Ação que a decisão muda: subsidiar o seguro suplementar para idosos sem cobertura privada, a fim de ampliar o acesso a consultas. A pergunta do decisor é: o seguro suplementar aumenta as consultas pela mesma lei?
tentativas_de_especificacao: 1
tem_titulares: true
quase_ids: [mulher, afro, casado]
grupo_justica: afro
