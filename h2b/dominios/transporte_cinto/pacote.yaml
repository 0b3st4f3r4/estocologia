  - [idade21, y]
  - [alcool008, y]
  - [trafego_log, y]
ambientes:
  descricao: >-
    Regime de fiscalização do cinto no estado-ano (no, secondary, primary). A lei intervém no uso do cinto (X);
    a pergunta do ICP é se ela age na mortalidade só por ele. "primary" fica no cofre, nunca visto; o treino tem
    só 2 ambientes (no, secondary), o que dá pouco poder ao ICP (limite declarado). O efeito permanente do estado sai
    pela linha de base de 1983–1984. Violações plausíveis declaradas: compensação de risco (a lei muda o jeito de
    dirigir, não só o cinto, que é o tema de Cohen & Einav); fiscalização primária vem junto de mais blitz em geral;
    estados que aprovam leis cedo diferem em tendência.
  cofre: [primary]
unidade: o estado (51 com DC); os anos de um estado dividem estradas, frota e polícia
cabecalho:
  processo_gerador: Estados aprovam leis de cinto (secundária, depois às vezes primária) em anos diferentes; o uso declarado sobe; a mortalidade por milha cai com o uso, com a frota e com a tendência nacional.
  nao_linearidade: Linear no uso e no ano sobre o log da mortalidade relativa à linha de base; o efeito do uso pode ser côncavo (os últimos a aderir dirigem pior).
  unidade_e_margem: O estado é a unidade (≈ 50 no treino); erro padrão agrupado por estado.
  fisica_do_ruido: Contagem de mortes sobre milhas, ruído de Poisson grande em estados pequenos; uso do cinto é autodeclarado (erro de medida que atenua o coeficiente).
  escada_causal: "Degrau 1 a 2 (leis em datas diferentes, mas não sorteadas). Premissas não testáveis: a lei não muda a mortalidade por outro canal além do uso; a autodeclaração do uso não muda com a lei."
shelf:
  quantidade: variação do log da mortalidade por milha por unidade de uso do cinto (0 → 100%)
  fonte: >-
    Cohen & Einav (2003): 10 pontos de uso a mais reduzem a mortalidade de ocupantes em ~1–2% sem sinal de
    compensação de risco; eficácia do cinto contra morte de ocupante dianteiro ~45% (NHTSA). Citados de memória,
    conferir; nenhum especialista humano consultado
  painel: literatura publicada; nenhum especialista humano consultado
  quartis: {q05: -0.45, q25: -0.25, q50: -0.15, q75: -0.07, q95: 0.05}
decisao:
  acao: passar da fiscalização secundária para a primária (≈ +10 pontos de uso)
  beneficio_por_unidade: -10.0
  custo: 1.0
  custo_pesquisa: 0.05
  nota: >-
    utilidade em pontos percentuais de mortalidade evitada: +0,1 de uso muda o log-mortalidade em 0,1·θ, ou 10·θ
    pontos percentuais (θ negativo vira benefício, por isso −10); o custo de 1 ponto equivale ao custo de
    fiscalização e de liberdade (suposição, não medida)
termo_escopo:
  vale_para: estados dos EUA entre 1983 e 1997, uso do cinto entre ~30% e ~90%, mortalidade total por milha
  nao_vale_para: outros países, uso acima de 90%, frotas com airbag universal, mortes só de ocupantes (não separadas aqui)
tentativas_de_especificacao: 1
tem_titulares: false
