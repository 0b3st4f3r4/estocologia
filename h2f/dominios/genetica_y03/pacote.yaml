ambientes:
  descricao: >-
    obs (262 selvagens), del_EJ (deleções nos cromossomos E–J), del_KP (K–P); cofre del_AD (A–D, nunca visto).
    Regra que não olha Y. Violações declaradas: efeitos globais de deleções fora dos candidatos (crescimento, ciclo
    celular) agem em Y sem estar medidos; plate é técnico e entra como candidato. Ver ../../DECLARACAO_H2f.md.
  cofre: [del_AD]
unidade: a amostra (perfil de expressão)
cabecalho:
  processo_gerador: Cada amostra é uma cultura (selvagem ou mutante de deleção) cujo transcriptoma é medido contra um pool de referência; deleções propagam-se pela rede reguladora.
  nao_linearidade: Aproximadamente linear em log-razão perto do equilíbrio; deleções são intervenções extremas (knockout), fora da faixa observacional.
  unidade_e_margem: A amostra é a unidade; lotes de cultivo e experimentadores diferentes (plate captura uma parte).
  fisica_do_ruido: Ruído de microarranjo multiplicativo, aproximadamente gaussiano em log; lotes.
  escada_causal: "Degrau 2 (deleções de alvo conhecido). Premissas não testáveis: as deleções fora dos candidatos não agem em Y diretamente (sabidamente violada em parte)."
shelf:
  quantidade: coeficiente de log-razão de Y em x1 (orientado positivamente), ajustado pelos outros candidatos
  fonte: argumento genérico; correlações de expressão moderadas, coeficiente parcial menor que a correlação; nenhum especialista humano consultado
  painel: argumento genérico; nenhum especialista humano consultado
  quartis: {q05: -0.1, q25: 0.1, q50: 0.3, q75: 0.5, q95: 0.9}
decisao:
  acao: usar a deleção de x1 como alavanca para baixar a expressão de Y
  beneficio_por_unidade: 1.0
  custo: 0.3
  custo_pesquisa: 0.02
  nota: decisão inventada, custo perto da mediana da priori; o F1 aqui não informa sobre o mundo
termo_escopo:
  vale_para: levedura BY4742 nas condições de cultivo do Deleteome; deleções de gene único
  nao_vale_para: deleções múltiplas, outras linhagens ou condições, expressão absoluta
tentativas_de_especificacao: 1
historico_especificacoes:
  - K: 1
    quando: H2f (2026-10-15, declarado antes de rodar em ../../DECLARACAO_H2f.md)
    o_que: especificação original; ICP com o teste K = 2 e a regra K = 3, α = 0,005 (Bonferroni em 10 Y)
tem_titulares: false
