# As ferramentas de conferencia do livro sao stdlib puro: nenhuma dependencia, e isso fica
# declarado em vez de descoberto. Sem rede no CI, sem lock para manter.
[project]
name = "estocologia-ferramentas"
version = "0.0.0"
description = "Conferidores do livro e do registro: rampa, blocos, lacres e prosa"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"
