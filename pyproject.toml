# The checking tools of the book are pure standard library: no dependency, and that is declared rather than
# discovered. No network in CI, no lock to maintain. Named estocologia-ferramentas until 2026-10-20.
[project]
name = "stochology-tools"
version = "0.0.0"
description = "Checkers of the book and the registry: ramp, blocks, seals and prose"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"
